<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Move Stock</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <script src="/assets/search-pick.js"></script>
        <style>
            .field {
                width: 100%;
                margin-bottom: 0.7rem;
            }
            label {
                display: block;
                font-size: 0.8rem;
                color: var(--muted);
                margin: 0 0.1rem 0.25rem;
            }
            .from-to {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                margin-bottom: 0.9rem;
            }
            .from-to .box {
                flex: 1;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 0.7rem;
                text-align: center;
            }
            .from-to .box .label {
                font-size: 0.7rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .from-to .box .val {
                font-weight: 700;
            }
            .from-to .arrow {
                font-size: 1.3rem;
                color: var(--muted);
            }
            .line {
                display: flex;
                gap: 0.4rem;
                margin-bottom: 0.6rem;
            }
            .line select.cat {
                width: 6.5rem;
                flex: none;
            }
            .line .searchpick {
                flex: 1;
                min-width: 0;
            }
            .line input[type="number"] {
                width: 4.6rem;
                flex: none;
            }
            .line .rm {
                border: none;
                background: none;
                color: var(--muted);
                font-size: 1.2rem;
                padding: 0 0.2rem;
            }
            .actions button {
                width: 100%;
                margin-top: 0.6rem;
                font-weight: 700;
                cursor: pointer;
            }
            #submitBtn {
                background: var(--accent);
                color: var(--accent-ink);
                border-color: var(--accent);
            }
            .note {
                font-size: 0.85rem;
                color: var(--muted);
                margin: 0.6rem 0.1rem;
            }
            #result {
                margin-top: 1rem;
                padding: 1rem;
                border-radius: 10px;
                display: none;
                white-space: pre-wrap;
            }
            #result.err {
                display: block;
                background: #fce8e6;
            }
            .spinner {
                display: none;
                margin: 1rem auto 0;
                width: 2.2rem;
                height: 2.2rem;
                border: 4px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            .busy .spinner,
            .spinner.loading {
                display: block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #successPanel {
                display: none;
                text-align: center;
                padding: 3rem 1rem;
            }
            #successPanel .big {
                font-size: 3rem;
            }
            #successPanel .msg {
                margin: 0.8rem 0 1.6rem;
                font-size: 1.05rem;
            }
            #successPanel a,
            #successPanel button {
                display: inline-block;
                background: var(--ink);
                color: #fff;
                text-decoration: none;
                font-weight: 700;
                padding: 0.8rem 1.6rem;
                border-radius: 10px;
                border: none;
                cursor: pointer;
                margin: 0 0.3rem;
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <span class="kiosk">🔄 Move Stock</span>
            <a class="staff" style="color: #fff" data-menu-link>‹ Menu</a>
        </div>
        <div class="wrap">
            <div id="formArea">
                <p class="note">
                    This creates a request only — stock isn't moved until the
                    owner approves it.
                </p>

                <div class="from-to" id="fromTo" style="display: none">
                    <div class="box">
                        <div class="label">From</div>
                        <select id="source" class="field" style="margin: 0">
                            <option value="">Select kiosk…</option>
                        </select>
                    </div>
                    <div class="arrow">→</div>
                    <div class="box">
                        <div class="label">To</div>
                        <select id="dest" class="field" style="margin: 0">
                            <option value="">Select kiosk…</option>
                        </select>
                    </div>
                </div>

                <div id="lines"></div>

                <div id="extras" style="display: none">
                    <label for="reason">Reason (optional)</label>
                    <select id="reason" class="field">
                        <option value="">Select reason…</option>
                    </select>
                    <label for="note">Note (optional)</label>
                    <input
                        id="note"
                        class="field"
                        type="text"
                        placeholder="Anything else to add"
                    />
                </div>

                <div class="actions" style="display: none">
                    <button id="addLine" onclick="addLine()">+ Add item</button>
                    <button id="submitBtn" onclick="submitTransfer()">
                        Submit request
                    </button>
                </div>
                <div class="spinner loading"></div>
                <div id="result"></div>
            </div>

            <div id="successPanel">
                <div class="big">✅</div>
                <div class="msg" id="successMsg"></div>
                <button onclick="location.reload()">Request another</button>
                <a data-menu-link>Back to menu</a>
            </div>
        </div>

        <script src="/assets/common.js"></script>
        <script>
            const TOKEN = initPage();
            const CLIENT_KEY =
                crypto && crypto.randomUUID
                    ? crypto.randomUUID()
                    : String(Date.now()) +
                      "-" +
                      Math.random().toString(36).slice(2);
            let BOOT = null;
            let byName = {};
            let categories = [];

            if (TOKEN) {
                apiCall("bootstrap_move_stock", { token: TOKEN })
                    .then(init)
                    .catch((e) => showError("Could not load: " + e.message));
            }

            function init(boot) {
                if (!boot.ok) return showError(boot.error);
                BOOT = boot;
                boot.items.forEach((p) => (byName[p.name] = p.id));
                categories = [...new Set(boot.items.map((p) => p.cat))].sort();

                const source = document.getElementById("source");
                const dest = document.getElementById("dest");
                const fillKiosks = (select, excludeId) => {
                    const prev = select.value;
                    select.innerHTML =
                        '<option value="">Not sure — owner will decide</option>';
                    boot.kiosks
                        .filter((k) => k.id !== excludeId)
                        .forEach((k) => {
                            const o = document.createElement("option");
                            o.value = k.id;
                            o.textContent = k.name;
                            select.appendChild(o);
                        });
                    if (prev && prev !== excludeId) select.value = prev;
                };
                fillKiosks(source, dest.value);
                fillKiosks(dest, source.value);
                source.value = boot.thisKiosk.id;
                fillKiosks(dest, source.value);
                source.onchange = () => fillKiosks(dest, source.value);
                dest.onchange = () => fillKiosks(source, dest.value);

                const reason = document.getElementById("reason");
                boot.reasons.forEach((r) => {
                    const o = document.createElement("option");
                    o.value = r.value;
                    o.textContent = r.label;
                    reason.appendChild(o);
                });
                if (!boot.reasons.length) reason.style.display = "none";

                addLine();
                document.getElementById("fromTo").style.display = "flex";
                document.getElementById("extras").style.display = "";
                document.querySelector(".actions").style.display = "";
                document.querySelector(".spinner").classList.remove("loading");
            }

            function addLine() {
                const div = document.createElement("div");
                div.className = "line";

                const sel = document.createElement("select");
                sel.className = "cat";
                sel.innerHTML = '<option value="">All</option>';
                categories.forEach(
                    (c) =>
                        (sel.innerHTML +=
                            '<option value="' + c + '">' + c + "</option>"),
                );

                const wrap = document.createElement("div");
                const qtyInp = document.createElement("input");
                qtyInp.type = "number";
                qtyInp.min = "1";
                qtyInp.step = "any";
                qtyInp.inputMode = "decimal";
                qtyInp.placeholder = "Qty";

                const rm = document.createElement("button");
                rm.className = "rm";
                rm.textContent = "✕";
                rm.onclick = () => div.remove();

                const picker = makeSearchPick(wrap, {
                    placeholder: "Search item…",
                    getItems: (q) => {
                        const taken = new Set(
                            [
                                ...document.querySelectorAll(
                                    ".line .searchpick input",
                                ),
                            ]
                                .filter((i) => i !== picker.input)
                                .map((i) => i.value.trim())
                                .filter((v) => byName[v]),
                        );
                        return BOOT.items
                            .filter(
                                (p) =>
                                    !taken.has(p.name) &&
                                    (!sel.value || p.cat === sel.value) &&
                                    (!q || p.name.toLowerCase().includes(q)),
                            )
                            .sort((a, b) => a.name.localeCompare(b.name))
                            .map((p) => ({ id: p.id, label: p.name }));
                    },
                    onSelect: () => qtyInp.focus(),
                });
                sel.onchange = () => {
                    picker.setLabel("");
                    if (document.activeElement === picker.input)
                        picker.refresh();
                };

                div.append(sel, wrap, qtyInp, rm);
                document.getElementById("lines").appendChild(div);
                div._picker = picker;
                div._qtyInp = qtyInp;
            }

            function submitTransfer() {
                const source = document.getElementById("source").value;
                const dest = document.getElementById("dest").value;
                if (!source && !dest)
                    return showError(
                        "Select at least one kiosk — where it's coming from, or going to.",
                    );

                const lines = [];
                for (const div of document.querySelectorAll(".line")) {
                    const name = div._picker.input.value.trim();
                    const qtyVal = div._qtyInp.value;
                    if (!name && !qtyVal) continue;
                    const id = byName[name];
                    if (!id)
                        return showError(
                            'Unknown item: "' + name + '". Pick from the list.',
                        );
                    const qty = Number(qtyVal);
                    if (!Number.isFinite(qty) || qty <= 0)
                        return showError(
                            name +
                                ": quantity must be a number greater than 0.",
                        );
                    lines.push({ stock_item_id: id, qty: qty });
                }
                if (!lines.length) return showError("Add at least one item.");

                setBusy(true);
                apiCall("submit", {
                    token: TOKEN,
                    formType: "MOVE_STOCK",
                    payload: {
                        client_key: CLIENT_KEY,
                        business_date: BOOT.businessDate,
                        source_kiosk_id: source,
                        destination_kiosk_id: dest,
                        reason: document.getElementById("reason").value,
                        note: document.getElementById("note").value,
                        lines: lines,
                    },
                })
                    .then((res) => {
                        setBusy(false);
                        if (res.ok) {
                            showSuccess(
                                "Transfer request sent for owner approval.",
                            );
                            kickProcessing();
                        } else showError(res.error);
                    })
                    .catch((e) => {
                        setBusy(false);
                        showError("Submit failed: " + e.message);
                    });
            }

            function setBusy(b) {
                document.body.classList.toggle("busy", b);
                for (const el of document.querySelectorAll(
                    "#formArea button, #formArea input, #formArea select",
                ))
                    el.disabled = b;
            }

            function showSuccess(msg) {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successMsg").textContent = msg;
                document.getElementById("successPanel").style.display = "block";
            }

            function showError(msg) {
                document.querySelector(".spinner").classList.remove("loading");
                const el = document.getElementById("result");
                el.className = "err";
                el.textContent = msg;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
    </body>
</html>
