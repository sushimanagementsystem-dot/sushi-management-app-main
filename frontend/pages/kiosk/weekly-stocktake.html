<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Weekly Stocktake</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .cat-head {
                margin: 1.2rem 0.2rem 0.4rem;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .count-row {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 0.55rem 0.7rem;
                margin-bottom: 0.4rem;
            }
            .count-row .pname {
                flex: 1;
                min-width: 0;
                font-size: 0.95rem;
            }
            .count-row .unit {
                flex: none;
                font-size: 0.8rem;
                color: var(--muted);
            }
            .count-row input {
                width: 4.6rem;
                flex: none;
                text-align: center;
                font: inherit;
                padding: 0.55rem 0.3rem;
                border: 1px solid var(--line);
                border-radius: 8px;
            }
            .actions button {
                width: 100%;
                margin-top: 0.8rem;
                font-weight: 700;
                font-size: 1rem;
                padding: 0.8rem;
                border-radius: 10px;
                border: 1px solid var(--accent);
                background: var(--accent);
                color: var(--accent-ink);
                cursor: pointer;
            }
            .note {
                font-size: 0.85rem;
                color: var(--muted);
                margin: 0.6rem 0.1rem;
            }
            .progress {
                font-size: 0.85rem;
                color: var(--muted);
                text-align: center;
                margin-top: 0.5rem;
            }
            #result {
                margin-top: 1rem;
                padding: 1rem;
                border-radius: 10px;
                display: none;
                white-space: pre-wrap;
            }
            #result.err {
                display: block;
                background: #fce8e6;
            }
            .banner {
                background: #fff8e1;
                border: 1px solid #f0e2ad;
                border-radius: 10px;
                padding: 0.8rem;
                font-size: 0.9rem;
                margin-bottom: 0.8rem;
                display: none;
            }
            .spinner {
                display: none;
                margin: 1rem auto 0;
                width: 2.2rem;
                height: 2.2rem;
                border: 4px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            .busy .spinner,
            .spinner.loading {
                display: block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #successPanel {
                display: none;
                text-align: center;
                padding: 3rem 1rem;
            }
            #successPanel .big {
                font-size: 3rem;
            }
            #successPanel .msg {
                margin: 0.8rem 0 1.6rem;
                font-size: 1.05rem;
            }
            #successPanel a {
                display: inline-block;
                background: var(--ink);
                color: #fff;
                text-decoration: none;
                font-weight: 700;
                padding: 0.8rem 1.6rem;
                border-radius: 10px;
            }
            .confirm-overlay {
                position: fixed;
                inset: 0;
                background: rgba(20, 24, 30, 0.45);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 50;
            }
            .confirm-box {
                background: var(--card);
                border-radius: 10px;
                padding: 1.4rem;
                width: 22rem;
                max-width: calc(100vw - 2rem);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            }
            .confirm-box p {
                margin: 0 0 1rem;
            }
            .confirm-actions {
                display: flex;
                gap: 0.6rem;
            }
            .confirm-actions button {
                flex: 1;
                font-weight: 700;
                padding: 0.7rem;
                border-radius: 8px;
                cursor: pointer;
            }
            .confirm-actions .cancel {
                border: 1px solid var(--line);
                background: var(--line);
                color: var(--ink);
            }
            .confirm-actions .go {
                border: 1px solid var(--accent);
                background: var(--accent);
                color: var(--accent-ink);
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <span class="kiosk">📋 Weekly Stocktake</span>
            <a class="staff" style="color: #fff" data-menu-link>‹ Menu</a>
        </div>
        <div class="wrap">
            <div id="formArea">
                <div class="banner" id="resubmitBanner">
                    Today already has a stocktake. Your earlier numbers are
                    loaded — edit and resubmit; this <b>replaces</b> today's
                    stocktake completely.
                </div>
                <p class="note">Decimals are fine for weight units.</p>

                <div id="rows"></div>

                <div class="actions" style="display: none">
                    <button id="submitBtn" onclick="submitCounts()">
                        Submit stocktake
                    </button>
                </div>
                <div class="progress" id="progress"></div>
                <div class="spinner loading"></div>
                <div id="result"></div>
            </div>

            <div id="successPanel">
                <div class="big">✅</div>
                <div class="msg" id="successMsg"></div>
                <a data-menu-link>Back to menu</a>
            </div>
        </div>

        <script src="/assets/common.js"></script>
        <script>
            const TOKEN = initPage();
            let BOOT = null;

            if (TOKEN) {
                apiCall("bootstrap_stocktake", { token: TOKEN })
                    .then(init)
                    .catch((e) => showError("Could not load: " + e.message));
            }

            function init(boot) {
                if (!boot.ok) return showError(boot.error);
                BOOT = boot;
                if (boot.alreadySubmitted)
                    document.getElementById("resubmitBanner").style.display =
                        "block";

                const holder = document.getElementById("rows");
                const byCat = {};
                boot.items.forEach((p) => {
                    byCat[p.cat] = byCat[p.cat] || [];
                    byCat[p.cat].push(p);
                });
                Object.keys(byCat)
                    .sort()
                    .forEach((cat) => {
                        const h = document.createElement("div");
                        h.className = "cat-head";
                        h.textContent = cat;
                        holder.appendChild(h);
                        byCat[cat].sort((a, b) => a.name.localeCompare(b.name));
                        byCat[cat].forEach((p) => {
                            const row = document.createElement("div");
                            row.className = "count-row";
                            row.dataset.iid = p.id;

                            const name = document.createElement("span");
                            name.className = "pname";
                            name.textContent = p.name;

                            const unit = document.createElement("span");
                            unit.className = "unit";
                            unit.textContent = p.unit;

                            const inp = document.createElement("input");
                            inp.type = "number";
                            inp.min = "0";
                            inp.step = "any";
                            inp.inputMode = "decimal";
                            const prev = boot.existingCounts[p.id];
                            if (prev !== undefined) inp.value = prev;

                            inp.addEventListener("input", updateProgress);

                            row.append(name, unit, inp);
                            holder.appendChild(row);
                        });
                    });

                document.querySelector(".actions").style.display = "";
                document.querySelector(".spinner").classList.remove("loading");
                updateProgress();
            }

            function rowsState() {
                const rows = [...document.querySelectorAll(".count-row")];
                const counts = {};
                let filled = 0;
                rows.forEach((row) => {
                    const v = row.querySelector("input").value.trim();
                    const q = Number(v);
                    counts[row.dataset.iid] = Number.isFinite(q) && q >= 0 ? q : 0;
                    if (v !== "") filled++;
                });
                return { counts, filled, total: rows.length };
            }

            function updateProgress() {
                const s = rowsState();
                document.getElementById("progress").textContent =
                    s.filled + " / " + s.total + " counted";
            }

            function submitCounts() {
                confirmSubmit("Submit this stocktake?").then((go) => {
                    if (go) doSubmit();
                });
            }

            function confirmSubmit(message) {
                return new Promise((resolve) => {
                    const overlay = document.createElement("div");
                    overlay.className = "confirm-overlay";
                    overlay.innerHTML =
                        '<div class="confirm-box"><p>' +
                        message +
                        '</p><div class="confirm-actions">' +
                        '<button class="cancel" id="confirmCancel">Cancel</button>' +
                        '<button class="go" id="confirmGo">Submit</button>' +
                        "</div></div>";
                    document.body.appendChild(overlay);
                    overlay.querySelector("#confirmCancel").addEventListener("click", () => {
                        overlay.remove();
                        resolve(false);
                    });
                    overlay.querySelector("#confirmGo").addEventListener("click", () => {
                        overlay.remove();
                        resolve(true);
                    });
                });
            }

            function doSubmit() {
                const s = rowsState();
                setBusy(true);
                apiCall("submit", {
                    token: TOKEN,
                    formType: "WEEKLY_STOCKTAKE",
                    payload: {
                        business_date: BOOT.businessDate,
                        counts: s.counts,
                    },
                })
                    .then((res) => {
                        setBusy(false);
                        if (res.ok) {
                            showSuccess("Stocktake saved.");
                            kickProcessing();
                        } else showError(res.error);
                    })
                    .catch((e) => {
                        setBusy(false);
                        showError("Submit failed: " + e.message);
                    });
            }

            function setBusy(b) {
                document.body.classList.toggle("busy", b);
                for (const el of document.querySelectorAll(
                    "#formArea button, #formArea input",
                ))
                    el.disabled = b;
            }

            function showSuccess(msg) {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successMsg").textContent = msg;
                document.getElementById("successPanel").style.display = "block";
            }

            function showError(msg) {
                document.querySelector(".spinner").classList.remove("loading");
                const el = document.getElementById("result");
                el.className = "err";
                el.textContent = msg;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
    </body>
</html>
