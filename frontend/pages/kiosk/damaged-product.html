<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Damaged Product</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <script src="/assets/search-pick.js"></script>
        <style>
            .field {
                width: 100%;
                margin-bottom: 0.7rem;
            }
            label {
                display: block;
                font-size: 0.8rem;
                color: var(--muted);
                margin: 0 0.1rem 0.25rem;
            }
            .photo-box {
                border: 2px dashed var(--line);
                border-radius: var(--radius);
                padding: 1rem;
                text-align: center;
                margin-bottom: 0.7rem;
                cursor: pointer;
            }
            .photo-box img {
                max-width: 100%;
                max-height: 14rem;
                border-radius: 8px;
                display: block;
                margin: 0 auto;
            }
            .photo-box .placeholder {
                color: var(--muted);
                font-size: 0.9rem;
                padding: 1.5rem 0;
            }
            .actions button {
                width: 100%;
                margin-top: 0.6rem;
                font-weight: 700;
                cursor: pointer;
            }
            #submitBtn {
                background: var(--accent);
                color: var(--accent-ink);
                border-color: var(--accent);
            }
            .note {
                font-size: 0.85rem;
                color: var(--muted);
                margin: 0.6rem 0.1rem;
            }
            #result {
                margin-top: 1rem;
                padding: 1rem;
                border-radius: 10px;
                display: none;
                white-space: pre-wrap;
            }
            #result.err {
                display: block;
                background: #fce8e6;
            }
            .spinner {
                display: none;
                margin: 1rem auto 0;
                width: 2.2rem;
                height: 2.2rem;
                border: 4px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            .busy .spinner,
            .spinner.loading {
                display: block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #successPanel {
                display: none;
                text-align: center;
                padding: 3rem 1rem;
            }
            #successPanel .big {
                font-size: 3rem;
            }
            #successPanel .msg {
                margin: 0.8rem 0 1.6rem;
                font-size: 1.05rem;
            }
            #successPanel a,
            #successPanel button {
                display: inline-block;
                background: var(--ink);
                color: #fff;
                text-decoration: none;
                font-weight: 700;
                padding: 0.8rem 1.6rem;
                border-radius: 10px;
                border: none;
                cursor: pointer;
                margin: 0 0.3rem;
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <span class="kiosk">📸 Damaged Product</span>
            <a class="staff" style="color: #fff" data-menu-link>‹ Menu</a>
        </div>
        <div class="wrap">
            <div id="formArea">
                <p class="note">
                    For finished products accidentally made unsellable — not
                    expired stock, that's Morning Waste. A photo is required.
                </p>

                <div id="fields" style="display: none">
                    <label for="cat">Category</label>
                    <select id="cat" class="field">
                        <option value="">Select category…</option>
                    </select>

                    <label for="prodPick">Product</label>
                    <div id="prodPick" class="field"></div>

                    <label for="qty">Quantity</label>
                    <input
                        id="qty"
                        class="field"
                        type="number"
                        min="1"
                        step="1"
                        inputmode="numeric"
                        value="1"
                    />

                    <label>Photo</label>
                    <div
                        class="photo-box"
                        id="photoBox"
                        onclick="document.getElementById('photoInput').click()"
                    >
                        <div class="placeholder" id="photoPlaceholder">
                            Tap to take or choose a photo
                        </div>
                        <img id="photoPreview" style="display: none" />
                    </div>
                    <input
                        id="photoInput"
                        type="file"
                        accept="image/*"
                        capture="environment"
                        style="display: none"
                    />
                </div>

                <div class="actions" style="display: none">
                    <button id="submitBtn" onclick="submitDamage()">
                        Submit
                    </button>
                </div>
                <div class="spinner loading"></div>
                <div id="result"></div>
            </div>

            <div id="successPanel">
                <div class="big">✅</div>
                <div class="msg" id="successMsg"></div>
                <button onclick="location.reload()">Log another</button>
                <a data-menu-link>Back to menu</a>
            </div>
        </div>

        <script src="/assets/common.js"></script>
        <script>
            const TOKEN = initPage();
            const CLIENT_KEY =
                crypto && crypto.randomUUID
                    ? crypto.randomUUID()
                    : String(Date.now()) +
                      "-" +
                      Math.random().toString(36).slice(2);
            let BOOT = null;
            let byName = {};
            let selectedProductId = "";
            let photoData = null; // { base64, mimeType, name }

            if (TOKEN) {
                apiCall("bootstrap_damaged_product", { token: TOKEN })
                    .then(init)
                    .catch((e) => showError("Could not load: " + e.message));
            }

            let prodPicker = null;

            function init(boot) {
                if (!boot.ok) return showError(boot.error);
                BOOT = boot;
                boot.products.forEach((p) => (byName[p.name] = p.id));

                const cat = document.getElementById("cat");
                [...new Set(boot.products.map((p) => p.cat))]
                    .sort()
                    .forEach((c) => {
                        const o = document.createElement("option");
                        o.value = c;
                        o.textContent = c;
                        cat.appendChild(o);
                    });
                cat.onchange = () => {
                    selectedProductId = "";
                    prodPicker.setLabel("");
                    prodPicker.input.disabled = !cat.value;
                    prodPicker.input.placeholder = cat.value
                        ? "Search product…"
                        : "Select category first…";
                };

                prodPicker = makeSearchPick(
                    document.getElementById("prodPick"),
                    {
                        placeholder: "Select category first…",
                        getItems: (q) => {
                            if (!cat.value) return [];
                            return boot.products
                                .filter(
                                    (p) =>
                                        p.cat === cat.value &&
                                        (!q || p.name.toLowerCase().includes(q)),
                                )
                                .sort((a, b) => a.name.localeCompare(b.name))
                                .map((p) => ({ id: p.id, label: p.name }));
                        },
                        onSelect: (item) => {
                            selectedProductId = item.id;
                            document.getElementById("qty").focus();
                        },
                    },
                );
                prodPicker.input.disabled = true;

                document
                    .getElementById("photoInput")
                    .addEventListener("change", onPhotoChosen);

                document.getElementById("fields").style.display = "";
                document.querySelector(".actions").style.display = "";
                document.querySelector(".spinner").classList.remove("loading");
            }

            function onPhotoChosen(ev) {
                const file = ev.target.files[0];
                if (!file) return;
                readFileForUpload(file).then((data) => {
                    photoData = data;
                    document.getElementById("photoPreview").src =
                        "data:" + data.mimeType + ";base64," + data.base64;
                    document.getElementById("photoPreview").style.display =
                        "block";
                    document.getElementById("photoPlaceholder").style.display =
                        "none";
                });
            }

            function submitDamage() {
                if (!selectedProductId) return showError("Select the product.");
                const qty = Number(document.getElementById("qty").value);
                if (!Number.isInteger(qty) || qty < 1)
                    return showError(
                        "Quantity must be a whole number, at least 1.",
                    );
                if (!photoData) return showError("A photo is required.");

                setBusy(true);
                apiCall("submit", {
                    token: TOKEN,
                    formType: "DAMAGED_PRODUCT",
                    payload: {
                        client_key: CLIENT_KEY,
                        business_date: BOOT.businessDate,
                        product_id: selectedProductId,
                        qty: qty,
                        photo: photoData,
                    },
                })
                    .then((res) => {
                        setBusy(false);
                        if (res.ok) {
                            showSuccess("Damage recorded.");
                            kickProcessing();
                        } else showError(res.error);
                    })
                    .catch((e) => {
                        setBusy(false);
                        showError("Submit failed: " + e.message);
                    });
            }

            function setBusy(b) {
                document.body.classList.toggle("busy", b);
                for (const el of document.querySelectorAll(
                    "#formArea button, #formArea input, #formArea select",
                ))
                    el.disabled = b;
            }

            function showSuccess(msg) {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successMsg").textContent = msg;
                document.getElementById("successPanel").style.display = "block";
            }

            function showError(msg) {
                document.querySelector(".spinner").classList.remove("loading");
                const el = document.getElementById("result");
                el.className = "err";
                el.textContent = msg;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
    </body>
</html>
