<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🆘</text></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Help / Issues</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .type-btn {
                display: block;
                width: 100%;
                text-align: left;
                font: inherit;
                font-weight: 600;
                background: var(--card);
                border: 2px solid var(--line);
                border-radius: var(--radius);
                padding: 1rem;
                margin-bottom: 0.6rem;
                cursor: pointer;
            }
            .type-btn small {
                display: block;
                font-weight: 400;
                color: var(--muted);
                margin-top: 0.2rem;
            }
            .type-btn.selected {
                border-color: var(--accent);
            }
            .type-btn.urgent.selected {
                border-color: #c0392b;
            }
            .field {
                width: 100%;
                margin-bottom: 0.7rem;
            }
            label {
                display: block;
                font-size: 0.8rem;
                color: var(--muted);
                margin: 0 0.1rem 0.25rem;
            }
            textarea.field {
                min-height: 6rem;
                resize: vertical;
            }
            .actions button {
                width: 100%;
                margin-top: 0.6rem;
                font-weight: 700;
                cursor: pointer;
            }
            #submitBtn {
                background: var(--accent);
                color: var(--accent-ink);
                border-color: var(--accent);
            }
            .note {
                font-size: 0.85rem;
                color: var(--muted);
                margin: 0.6rem 0.1rem;
            }
            .photo-box {
                border: 2px dashed var(--line);
                border-radius: var(--radius);
                padding: 1rem;
                text-align: center;
                margin-bottom: 0.7rem;
                cursor: pointer;
            }
            .photo-box img,
            .photo-box video {
                max-width: 100%;
                max-height: 14rem;
                border-radius: 8px;
                display: block;
                margin: 0 auto;
            }
            .photo-box .placeholder {
                color: var(--muted);
                font-size: 0.9rem;
                padding: 1.5rem 0;
            }
            #result {
                margin-top: 1rem;
                padding: 1rem;
                border-radius: 10px;
                display: none;
                white-space: pre-wrap;
            }
            #result.err {
                display: block;
                background: #fce8e6;
            }
            .spinner {
                display: none;
                margin: 1rem auto 0;
                width: 2.2rem;
                height: 2.2rem;
                border: 4px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            .busy .spinner,
            .spinner.loading {
                display: block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #successPanel {
                display: none;
                text-align: center;
                padding: 3rem 1rem;
            }
            #successPanel .big {
                font-size: 3rem;
            }
            #successPanel .msg {
                margin: 0.8rem 0 1.6rem;
                font-size: 1.05rem;
            }
            #successPanel a,
            #successPanel button {
                display: inline-block;
                background: var(--ink);
                color: #fff;
                text-decoration: none;
                font-weight: 700;
                padding: 0.8rem 1.6rem;
                border-radius: 10px;
                border: none;
                cursor: pointer;
                margin: 0 0.3rem;
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <span class="kiosk">🆘 Help / Issues</span>
            <a class="staff" style="color: #fff" data-menu-link>‹ Menu</a>
        </div>
        <div class="wrap">
            <div id="formArea">
                <p class="note">
                    This form is not an emergency service — if there's danger,
                    take immediate safe action first.
                </p>

                <div id="typePick" style="display: none">
                    <button class="type-btn" data-type="KIOSK_ISSUE">
                        Kiosk Issue
                        <small
                            >Something's broken or not working. Reviewed within
                            3 days.</small
                        >
                    </button>
                    <button class="type-btn" data-type="HELP_NEEDED">
                        Help Needed
                        <small
                            >You need support with something. Reviewed within 7
                            days.</small
                        >
                    </button>
                    <button class="type-btn" data-type="FEEDBACK">
                        Feedback / Suggestion
                        <small
                            >An idea or comment for the owner. Reviewed within
                            14 days.</small
                        >
                    </button>
                    <button class="type-btn urgent" data-type="URGENT">
                        Urgent Issue
                        <small>Needs attention right away.</small>
                    </button>
                </div>

                <div id="details" style="display: none">
                    <label for="cat">Category (optional)</label>
                    <select id="cat" class="field">
                        <option value="">Select category…</option>
                    </select>

                    <label for="title">Short title</label>
                    <input
                        id="title"
                        class="field"
                        type="text"
                        placeholder="e.g. Fridge not cooling"
                    />

                    <label for="text">Details</label>
                    <textarea
                        id="text"
                        class="field"
                        placeholder="What's going on?"
                    ></textarea>

                    <label>Photo or video</label>
                    <div
                        class="photo-box"
                        id="photoBox"
                        onclick="document.getElementById('photoInput').click()"
                    >
                        <div class="placeholder" id="photoPlaceholder">
                            Tap to take or choose a photo or video
                        </div>
                        <img id="photoPreview" style="display: none" />
                        <video
                            id="videoPreview"
                            style="display: none"
                            controls
                        ></video>
                    </div>
                    <input
                        id="photoInput"
                        type="file"
                        accept="image/*,video/*"
                        capture="environment"
                        style="display: none"
                    />
                </div>

                <div class="actions" style="display: none">
                    <button id="submitBtn" onclick="submitReport()">
                        Submit report
                    </button>
                </div>
                <div class="spinner loading"></div>
                <div id="result"></div>
            </div>

            <div id="successPanel">
                <div class="big">✅</div>
                <div class="msg" id="successMsg"></div>
                <button onclick="location.reload()">Report another</button>
                <a data-menu-link>Back to menu</a>
            </div>
        </div>

        <script src="/assets/common.js"></script>
        <script>
            const TOKEN = initPage();
            const CLIENT_KEY =
                crypto && crypto.randomUUID
                    ? crypto.randomUUID()
                    : String(Date.now()) +
                      "-" +
                      Math.random().toString(36).slice(2);
            let BOOT = null;
            let TYPE = null;
            let photoData = null; // { base64, mimeType, name }

            if (TOKEN) {
                apiCall("bootstrap_help_issue", { token: TOKEN })
                    .then(init)
                    .catch((e) => showError("Could not load: " + e.message));
            }

            function init(boot) {
                if (!boot.ok) return showError(boot.error);
                BOOT = boot;
                document.querySelector(".spinner").classList.remove("loading");

                const cat = document.getElementById("cat");
                boot.categories.forEach((c) => {
                    const o = document.createElement("option");
                    o.value = c.value;
                    o.textContent = c.label;
                    cat.appendChild(o);
                });
                if (!boot.categories.length) cat.style.display = "none";

                document
                    .getElementById("photoInput")
                    .addEventListener("change", onPhotoChosen);

                document.getElementById("typePick").style.display = "";
                document.querySelectorAll(".type-btn").forEach((btn) => {
                    btn.onclick = () => pickType(btn.dataset.type, btn);
                });
            }

            function pickType(type, btn) {
                TYPE = type;
                document
                    .querySelectorAll(".type-btn")
                    .forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                document.getElementById("details").style.display = "";
                document.querySelector(".actions").style.display = "";
            }

            function onPhotoChosen(ev) {
                const file = ev.target.files[0];
                if (!file) return;
                readFileForUpload(file).then((data) => {
                    photoData = data;
                    const dataUrl =
                        "data:" + data.mimeType + ";base64," + data.base64;
                    const isVideo = (data.mimeType || "").startsWith("video/");
                    document.getElementById("photoPlaceholder").style.display =
                        "none";
                    document.getElementById("photoPreview").style.display =
                        isVideo ? "none" : "block";
                    document.getElementById("videoPreview").style.display =
                        isVideo ? "block" : "none";
                    if (isVideo)
                        document.getElementById("videoPreview").src = dataUrl;
                    else document.getElementById("photoPreview").src = dataUrl;
                });
            }

            function submitReport() {
                if (!TYPE)
                    return showError("Pick what kind of report this is.");
                const title = document.getElementById("title").value.trim();
                const text = document.getElementById("text").value.trim();
                if (!title) return showError("Give it a short title.");
                if (!text) return showError("Add details.");
                if (!photoData)
                    return showError("A photo or video is required.");

                setBusy(true);
                apiCall("submit", {
                    token: TOKEN,
                    formType: "HELP_ISSUE",
                    payload: {
                        client_key: CLIENT_KEY,
                        business_date: BOOT.businessDate,
                        request_type: TYPE,
                        category: document.getElementById("cat").value,
                        title: title,
                        details: text,
                        photo: photoData,
                    },
                })
                    .then((res) => {
                        setBusy(false);
                        if (res.ok) {
                            showSuccess("Report submitted.");
                            kickProcessing();
                        } else showError(res.error);
                    })
                    .catch((e) => {
                        setBusy(false);
                        showError("Submit failed: " + e.message);
                    });
            }

            function setBusy(b) {
                document.body.classList.toggle("busy", b);
                for (const el of document.querySelectorAll(
                    "#formArea button, #formArea input, #formArea select, #formArea textarea",
                ))
                    el.disabled = b;
            }

            function showSuccess(msg) {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successMsg").textContent = msg;
                document.getElementById("successPanel").style.display = "block";
            }

            function showError(msg) {
                document.querySelector(".spinner").classList.remove("loading");
                const el = document.getElementById("result");
                el.className = "err";
                el.textContent = msg;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
    </body>
</html>
