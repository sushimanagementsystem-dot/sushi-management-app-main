<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Staff Food</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <script src="/assets/search-pick.js"></script>
        <style>
            .field {
                width: 100%;
                margin-bottom: 0.7rem;
            }
            label {
                display: block;
                font-size: 0.8rem;
                color: var(--muted);
                margin: 0 0.1rem 0.25rem;
            }
            .actions button {
                width: 100%;
                margin-top: 0.6rem;
                font-weight: 700;
                cursor: pointer;
            }
            #submitBtn {
                background: var(--accent);
                color: var(--accent-ink);
                border-color: var(--accent);
            }
            .note {
                font-size: 0.85rem;
                color: var(--muted);
                margin: 0.6rem 0.1rem;
            }
            .banner {
                background: #fff8e1;
                border: 1px solid #f0e2ad;
                border-radius: 10px;
                padding: 0.8rem;
                font-size: 0.9rem;
                margin-bottom: 0.8rem;
                display: none;
            }
            #result {
                margin-top: 1rem;
                padding: 1rem;
                border-radius: 10px;
                display: none;
                white-space: pre-wrap;
            }
            #result.err {
                display: block;
                background: #fce8e6;
            }
            .spinner {
                display: none;
                margin: 1rem auto 0;
                width: 2.2rem;
                height: 2.2rem;
                border: 4px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            .busy .spinner,
            .spinner.loading {
                display: block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #successPanel {
                display: none;
                text-align: center;
                padding: 3rem 1rem;
            }
            #successPanel .big {
                font-size: 3rem;
            }
            #successPanel .msg {
                margin: 0.8rem 0 1.6rem;
                font-size: 1.05rem;
            }
            #successPanel a,
            #successPanel button {
                display: inline-block;
                background: var(--ink);
                color: #fff;
                text-decoration: none;
                font-weight: 700;
                padding: 0.8rem 1.6rem;
                border-radius: 10px;
                border: none;
                cursor: pointer;
                margin: 0 0.3rem;
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <span class="kiosk">🍱 Staff Food</span>
            <a class="staff" style="color: #fff" data-menu-link>‹ Menu</a>
        </div>
        <div class="wrap">
            <div id="formArea">
                <p class="note">
                    Record your own authorised meal — one product per person
                    per shift.
                </p>

                <div class="banner" id="editBanner">
                    You already logged food today — this
                    <b>replaces</b> that entry.
                </div>

                <div id="fields" style="display: none">
                    <label for="cat">Category</label>
                    <select id="cat" class="field">
                        <option value="">Select category…</option>
                    </select>

                    <label for="prodPick">Product</label>
                    <div id="prodPick" class="field"></div>
                </div>

                <div class="actions" style="display: none">
                    <button id="submitBtn" onclick="submitFood()">
                        Submit
                    </button>
                </div>
                <div class="spinner loading"></div>
                <div id="result"></div>
            </div>

            <div id="successPanel">
                <div class="big">✅</div>
                <div class="msg" id="successMsg"></div>
                <a data-menu-link>Back to menu</a>
            </div>
        </div>

        <script src="/assets/common.js"></script>
        <script>
            const TOKEN = initPage();
            let BOOT = null;

            const cat = document.getElementById("cat");
            let selectedProductId = "";
            let selectedProductName = "";

            const prodPicker = makeSearchPick(
                document.getElementById("prodPick"),
                {
                    placeholder: "Select category first…",
                    getItems: (q) => {
                        if (!cat.value) return [];
                        return BOOT.products
                            .filter(
                                (p) =>
                                    p.cat === cat.value &&
                                    (!q || p.name.toLowerCase().includes(q)),
                            )
                            .sort((a, b) => a.name.localeCompare(b.name))
                            .map((p) => ({ id: p.id, label: p.name }));
                    },
                    onSelect: (item) => {
                        selectedProductId = item.id;
                        selectedProductName = item.label;
                    },
                },
            );
            prodPicker.input.disabled = true;

            if (TOKEN) {
                apiCall("bootstrap_staff_food", { token: TOKEN })
                    .then(init)
                    .catch((e) => showError("Could not load: " + e.message));
            }

            function init(boot) {
                if (!boot.ok) return showError(boot.error);
                BOOT = boot;

                [...new Set(boot.products.map((p) => p.cat))]
                    .sort()
                    .forEach((c) => {
                        const o = document.createElement("option");
                        o.value = c;
                        o.textContent = c;
                        cat.appendChild(o);
                    });

                cat.onchange = () => resetProductPick();

                if (boot.existing) {
                    document.getElementById("editBanner").style.display =
                        "block";
                    pickProduct(boot.existing.product_id);
                }

                document.getElementById("fields").style.display = "";
                document.querySelector(".actions").style.display = "";
                document.querySelector(".spinner").classList.remove("loading");
            }

            function resetProductPick() {
                selectedProductId = "";
                selectedProductName = "";
                prodPicker.setLabel("");
                prodPicker.input.disabled = !cat.value;
                prodPicker.input.placeholder = cat.value
                    ? "Search product…"
                    : "Select category first…";
            }

            function pickProduct(id) {
                const p = BOOT.products.find((x) => x.id === id);
                if (!p) return;
                cat.value = p.cat;
                resetProductPick();
                selectedProductId = p.id;
                selectedProductName = p.name;
                prodPicker.setLabel(p.name);
            }

            function submitFood() {
                if (!selectedProductId) return showError("Select a product.");

                setBusy(true);
                apiCall("submit", {
                    token: TOKEN,
                    formType: "STAFF_FOOD",
                    payload: {
                        business_date: BOOT.businessDate,
                        product_id: selectedProductId,
                    },
                })
                    .then((res) => {
                        setBusy(false);
                        if (res.ok) {
                            showSuccess("Staff food recorded.");
                            kickProcessing();
                        } else showError(res.error);
                    })
                    .catch((e) => {
                        setBusy(false);
                        showError("Submit failed: " + e.message);
                    });
            }

            function setBusy(b) {
                document.body.classList.toggle("busy", b);
                for (const el of document.querySelectorAll(
                    "#formArea button, #formArea input, #formArea select",
                ))
                    el.disabled = b;
            }

            function showSuccess(msg) {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successMsg").textContent = msg;
                document.getElementById("successPanel").style.display = "block";
            }

            function showError(msg) {
                document.querySelector(".spinner").classList.remove("loading");
                const el = document.getElementById("result");
                el.className = "err";
                el.textContent = msg;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
    </body>
</html>
