<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Monthly Audit</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .sec-head {
                margin: 0 0.2rem 0.6rem;
                font-size: 0.8rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--line);
                padding-bottom: 0.3rem;
            }
            .sec-nav {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                margin: 0.4rem 0 1rem;
            }
            .sec-nav button {
                font: inherit;
                font-weight: 700;
                padding: 0.6rem 0.9rem;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: #fff;
                cursor: pointer;
            }
            .sec-nav button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            .sec-nav .sec-label {
                flex: 1;
                text-align: center;
                font-size: 0.85rem;
                color: var(--muted);
            }
            .section-block {
                display: none;
            }
            .section-block.active {
                display: block;
            }
            .q-card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 0.8rem;
                margin-bottom: 0.6rem;
            }
            .q-card.missing {
                border-color: #e8b3b3;
            }
            .q-text {
                font-size: 0.95rem;
                margin-bottom: 0.6rem;
            }
            .q-text .critical {
                color: #c0392b;
                font-size: 0.7rem;
                font-weight: 700;
                text-transform: uppercase;
                margin-right: 0.3rem;
            }
            .ans-row {
                display: flex;
                gap: 0.4rem;
            }
            .ans-btn {
                flex: 1;
                font: inherit;
                font-weight: 700;
                padding: 0.6rem;
                border: 2px solid var(--line);
                border-radius: 8px;
                background: #fff;
                cursor: pointer;
            }
            .ans-btn.selected[data-a="YES"] {
                border-color: #188038;
                background: #e6f4ea;
            }
            .ans-btn.selected[data-a="NO"] {
                border-color: #c0392b;
                background: #fce8e6;
            }
            .ans-btn.selected[data-a="NA"] {
                border-color: var(--muted);
                background: #f2f3f5;
            }
            .q-photo {
                margin-top: 0.6rem;
                border: 2px dashed var(--line);
                border-radius: 8px;
                padding: 0.6rem;
                text-align: center;
                font-size: 0.8rem;
                color: var(--muted);
                cursor: pointer;
            }
            .q-photo img {
                max-width: 100%;
                max-height: 8rem;
                border-radius: 6px;
                display: block;
                margin: 0 auto;
            }
            .actions button {
                width: 100%;
                margin-top: 0.6rem;
                font-weight: 700;
                font-size: 1rem;
                padding: 0.8rem;
                border-radius: 10px;
                border: 1px solid var(--accent);
                background: var(--accent);
                color: var(--accent-ink);
                cursor: pointer;
            }
            .note {
                font-size: 0.85rem;
                color: var(--muted);
                margin: 0.6rem 0.1rem;
            }
            .progress {
                font-size: 0.85rem;
                color: var(--muted);
                text-align: center;
                margin-top: 0.5rem;
            }
            #result {
                margin-top: 1rem;
                padding: 1rem;
                border-radius: 10px;
                display: none;
                white-space: pre-wrap;
            }
            #result.err {
                display: block;
                background: #fce8e6;
            }
            .banner {
                background: #fff8e1;
                border: 1px solid #f0e2ad;
                border-radius: 10px;
                padding: 0.8rem;
                font-size: 0.9rem;
                margin-bottom: 0.8rem;
            }
            .spinner {
                display: none;
                margin: 1rem auto 0;
                width: 2.2rem;
                height: 2.2rem;
                border: 4px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            .busy .spinner,
            .spinner.loading {
                display: block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #successPanel {
                display: none;
                text-align: center;
                padding: 3rem 1rem;
            }
            #successPanel .big {
                font-size: 3rem;
            }
            #successPanel .msg {
                margin: 0.8rem 0 1.6rem;
                font-size: 1.05rem;
            }
            #successPanel a {
                display: inline-block;
                background: var(--ink);
                color: #fff;
                text-decoration: none;
                font-weight: 700;
                padding: 0.8rem 1.6rem;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <span class="kiosk">🔍 Monthly Audit</span>
            <a class="staff" style="color: #fff" data-menu-link>‹ Menu</a>
        </div>
        <div class="wrap">
            <div id="lockedArea" style="display: none">
                <div class="banner" id="lockedBanner"></div>
                <a data-menu-link>Back to menu</a>
            </div>

            <div id="formArea">
                <div class="banner" id="resubmitBanner" style="display: none">
                    Today already has an audit in progress. Your earlier answers
                    are loaded — edit and resubmit; this <b>replaces</b> them.
                </div>
                <p class="note">
                    Answer every question. Photos are required where marked.
                </p>

                <div class="sec-nav" id="secNav" style="display: none">
                    <button
                        id="prevBtn"
                        onclick="showSection(currentSection - 1)"
                    >
                        ‹ Prev
                    </button>
                    <span class="sec-label" id="secLabel"></span>
                    <button
                        id="nextBtn"
                        onclick="showSection(currentSection + 1)"
                    >
                        Next ›
                    </button>
                </div>

                <div id="sections"></div>

                <div class="actions" style="display: none">
                    <button id="submitBtn" onclick="submitAudit()">
                        Submit audit
                    </button>
                </div>
                <div class="progress" id="progress"></div>
                <div class="spinner loading"></div>
                <div id="result"></div>
            </div>

            <div id="successPanel">
                <div class="big">✅</div>
                <div class="msg" id="successMsg"></div>
                <a data-menu-link>Back to menu</a>
            </div>
        </div>

        <script src="/assets/common.js"></script>
        <script>
            const TOKEN = initPage();
            let BOOT = null;
            const rows = {}; // question_id -> { card, answer, photoData }
            const sectionBlocks = []; // { id, name, el }
            let currentSection = 0;

            if (TOKEN) {
                apiCall("bootstrap_monthly_audit", { token: TOKEN })
                    .then(init)
                    .catch((e) => showError("Could not load: " + e.message));
            }

            function init(boot) {
                if (!boot.ok) return showError(boot.error);
                if (boot.locked) {
                    document.getElementById("formArea").style.display = "none";
                    document.getElementById("lockedArea").style.display =
                        "block";
                    document.getElementById("lockedBanner").textContent =
                        boot.lockedReason;
                    document
                        .querySelector(".spinner")
                        .classList.remove("loading");
                    return;
                }
                BOOT = boot;
                if (boot.alreadySubmitted)
                    document.getElementById("resubmitBanner").style.display =
                        "block";

                const bySection = {};
                boot.questions.forEach((q) => {
                    (bySection[q.sectionId] =
                        bySection[q.sectionId] || []).push(q);
                });

                const holder = document.getElementById("sections");
                boot.sections.forEach((sec) => {
                    const qs = bySection[sec.id];
                    if (!qs || !qs.length) return;
                    const block = document.createElement("div");
                    block.className = "section-block";
                    const h = document.createElement("div");
                    h.className = "sec-head";
                    h.textContent = sec.name;
                    block.appendChild(h);
                    qs.forEach((q) => block.appendChild(buildQuestionCard(q)));
                    holder.appendChild(block);
                    sectionBlocks.push({
                        id: sec.id,
                        name: sec.name,
                        el: block,
                    });
                });

                if (sectionBlocks.length > 1)
                    document.getElementById("secNav").style.display = "flex";
                if (sectionBlocks.length) showSection(0);

                document.querySelector(".actions").style.display = "";
                document.querySelector(".spinner").classList.remove("loading");
                updateProgress();
            }

            function showSection(i) {
                if (i < 0 || i >= sectionBlocks.length) return;
                sectionBlocks.forEach((s, idx) =>
                    s.el.classList.toggle("active", idx === i),
                );
                currentSection = i;
                document.getElementById("secLabel").textContent =
                    sectionBlocks[i].name +
                    " (" +
                    (i + 1) +
                    "/" +
                    sectionBlocks.length +
                    ")";
                document.getElementById("prevBtn").disabled = i === 0;
                document.getElementById("nextBtn").disabled =
                    i === sectionBlocks.length - 1;
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            /** Which section index a question card lives in. */
            function sectionIndexOf(card) {
                return sectionBlocks.findIndex((s) => s.el.contains(card));
            }

            function buildQuestionCard(q) {
                const card = document.createElement("div");
                card.className = "q-card";

                const text = document.createElement("div");
                text.className = "q-text";
                text.innerHTML =
                    (q.critical
                        ? '<span class="critical">Critical</span>'
                        : "") + q.text;

                const ansRow = document.createElement("div");
                ansRow.className = "ans-row";
                const opts = ["YES", "NO"].concat(q.naAllowed ? ["NA"] : []);
                const buttons = {};
                opts.forEach((a) => {
                    const btn = document.createElement("button");
                    btn.className = "ans-btn";
                    btn.dataset.a = a;
                    btn.textContent = a === "NA" ? "N/A" : a;
                    btn.onclick = () => selectAnswer(q.id, a);
                    buttons[a] = btn;
                    ansRow.appendChild(btn);
                });

                // Only questions that actually require evidence get a photo
                // button at all — no "(optional)" button cluttering the rest.
                let photoBox = null;
                if (q.evidenceRequired) {
                    photoBox = document.createElement("div");
                    photoBox.className = "q-photo";
                    photoBox.textContent = "Tap to add evidence photo (required)";
                    const photoInput = document.createElement("input");
                    photoInput.type = "file";
                    photoInput.accept = "image/*";
                    photoInput.capture = "environment";
                    photoInput.style.display = "none";
                    photoBox.onclick = () => photoInput.click();
                    photoInput.addEventListener("change", (ev) =>
                        onPhotoChosen(q.id, ev),
                    );
                    card.append(text, ansRow, photoBox, photoInput);
                } else {
                    card.append(text, ansRow);
                }

                rows[q.id] = {
                    card: card,
                    answer: "",
                    photoData: null,
                    existingPhotoRef: "",
                    buttons: buttons,
                    photoBox: photoBox,
                    q: q,
                };

                const prev = BOOT.existingAnswers && BOOT.existingAnswers[q.id];
                if (prev) {
                    selectAnswer(q.id, prev.answer);
                    if (prev.evidencePhotoReference) {
                        rows[q.id].existingPhotoRef =
                            prev.evidencePhotoReference;
                        if (photoBox)
                            photoBox.textContent =
                                "✓ Photo already attached — tap to replace";
                    }
                }

                return card;
            }

            function selectAnswer(qid, answer) {
                const row = rows[qid];
                row.answer = answer;
                Object.keys(row.buttons).forEach((a) =>
                    row.buttons[a].classList.toggle("selected", a === answer),
                );
                row.card.classList.remove("missing");
                updateProgress();
            }

            function onPhotoChosen(qid, ev) {
                const file = ev.target.files[0];
                if (!file) return;
                readFileForUpload(file).then((data) => {
                    const row = rows[qid];
                    row.photoData = data;
                    row.photoBox.innerHTML =
                        '<img src="data:' +
                        data.mimeType +
                        ";base64," +
                        data.base64 +
                        '">';
                });
            }

            function updateProgress() {
                const ids = Object.keys(rows);
                const answered = ids.filter((id) => rows[id].answer).length;
                document.getElementById("progress").textContent =
                    answered + " / " + ids.length + " answered";
            }

            function submitAudit() {
                const answers = {};
                const missing = [];
                Object.keys(rows).forEach((qid) => {
                    const row = rows[qid];
                    row.card.classList.remove("missing");
                    if (!row.answer) {
                        missing.push(row);
                        return;
                    }
                    const hasEvidence = row.photoData || row.existingPhotoRef;
                    if (
                        row.q.evidenceRequired &&
                        row.answer !== "NA" &&
                        !hasEvidence
                    ) {
                        missing.push(row);
                        return;
                    }
                    const a = { answer: row.answer };
                    if (row.photoData) a.photo = row.photoData;
                    else if (row.existingPhotoRef)
                        a.evidence_photo_reference = row.existingPhotoRef;
                    answers[qid] = a;
                });
                if (missing.length) {
                    missing.forEach((r) => r.card.classList.add("missing"));
                    const idx = sectionIndexOf(missing[0].card);
                    const switchedSection =
                        idx !== -1 && idx !== currentSection;
                    if (switchedSection) showSection(idx);
                    setTimeout(
                        () =>
                            missing[0].card.scrollIntoView({
                                behavior: "smooth",
                                block: "center",
                            }),
                        switchedSection ? 300 : 0,
                    );
                    return showError(
                        missing.length +
                            " question(s) need an answer or a required photo.",
                    );
                }

                setBusy(true);
                apiCall("submit", {
                    token: TOKEN,
                    formType: "MONTHLY_AUDIT",
                    payload: {
                        business_date: BOOT.businessDate,
                        answers: answers,
                    },
                })
                    .then((res) => {
                        setBusy(false);
                        if (res.ok) {
                            showSuccess("Audit submitted for owner review.");
                            kickProcessing();
                        } else showError(res.error);
                    })
                    .catch((e) => {
                        setBusy(false);
                        showError("Submit failed: " + e.message);
                    });
            }

            function setBusy(b) {
                document.body.classList.toggle("busy", b);
                for (const el of document.querySelectorAll("#formArea button"))
                    el.disabled = b;
            }

            function showSuccess(msg) {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successMsg").textContent = msg;
                document.getElementById("successPanel").style.display = "block";
            }

            function showError(msg) {
                document.querySelector(".spinner").classList.remove("loading");
                const el = document.getElementById("result");
                el.className = "err";
                el.textContent = msg;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
    </body>
</html>
