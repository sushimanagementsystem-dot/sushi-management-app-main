                        this.updateToolbarButtons();
                    });
            }

            toggleEditMode() {
                this.editMode = true;
                this.rebuildColumns();
            }

            cancelEdits() {
                const proceed = () => {
                    this.dirty = {};
                    this.editMode = false;
                    this.tableReady
                        .then(() => this.tabulator.replaceData(JSON.parse(JSON.stringify(this.originalRows))))
                        .then(() => this.tabulator.setFilter((row) => this.rowMatchesFilters(row)))
                        .then(() => this.rebuildColumns());
                };
                if (Object.keys(this.dirty).length) {
                    confirmModal("Discard all unsaved changes?").then((yes) => yes && proceed());
                } else {
                    proceed();
                }
            }

            /**
             * Full takeover of this instance's grid area — used when a
             * background save fails (see saveDirtyRows). By the time a
             * failure comes back, the admin has already been shown the
             * edit as saved and moved on, so there's no reliable way to
             * mark just the bad cells; this instance's whole local state
             * is suspect until reloaded fresh from source.
             */
            showTableSaveError(message) {
                if (this.tabulator) {
                    this.tabulator.destroy();
                    this.tabulator = null;
                }
                this.toolbarEl.style.display = "none";
                this.gridEl.style.display = "";
                this.gridEl.innerHTML = "";
                const box = document.createElement("div");
                box.className = "table-save-error";
                const p = document.createElement("p");
                p.textContent = message;
                box.appendChild(p);
                const reloadBtn = document.createElement("button");
                reloadBtn.className = "dash-btn";
                reloadBtn.textContent = "Reload table";
                reloadBtn.addEventListener("click", () => {
                    this.gridEl.innerHTML = "";
                    this.load();
                });
                box.appendChild(reloadBtn);
                this.gridEl.appendChild(box);
            }

            /**
             * Optimistic: leaves Edit mode and shows the grid as saved
             * immediately, without waiting on the round trip — the
             * requests still go out and are awaited, just in the
             * background. On success this is a no-op beyond what already
             * happened locally. On failure, this instance's whole view is
             * replaced with an error + reload prompt (showTableSaveError)
             * rather than trying to reconcile which rows actually made it,
             * since the grid was already shown as clean.
             */
            saveDirtyRows() {
                const entries = Object.entries(this.dirty);
                // Any enum-manage popup edits (this instance's columns or
                // another grid's, from earlier in the session) ride along
                // here too — they were never sent on their own, only ever
                // queued until whichever Save actually gets clicked.
                const enumEntries = Object.entries(ENUM_OPTION_DIRTY);
                if (!entries.length && !enumEntries.length) return;

                // Deleted rows (single ❌ or bulk) were only ever hidden via
                // the filter (queueRowDelete_/rowMatchesFilters), never
                // actually removed from Tabulator's own data — getData()
                // below would still include them. Exclude them here, from
                // `entries` (still has the real isDelete flags), before
                // this.dirty is cleared and that information is gone.
                const deleteKeys = new Set(entries.filter(([, d]) => d.isDelete).map(([key]) => key));
                const survivingRows = this.tabulator.getData().filter((row) => !deleteKeys.has(this.rowKeyStr(row)));

                this.dirty = {};
                ENUM_OPTION_DIRTY = {};
                this.editMode = false;
                // Local baseline moves forward optimistically — a later
                // Cancel should only undo edits made after this point, not
                // this save.
                this.originalRows = JSON.parse(JSON.stringify(survivingRows));
                // A no-op unless this table is also cached as some
                // parent's embedded child (see CHILD_TABLE_CACHE) — drops
                // that session-lifetime snapshot so the next detail view
                // opened for *any* parent re-fetches fresh instead of
                // showing this table as it was before this save. Simpler
                // and safer than merging this save into the cached rows
                // by hand; the cost is one extra round trip next time,
                // not a correctness risk.
                delete CHILD_TABLE_CACHE[this.tableName];
                // Forces genuinely fresh cell DOM nodes, so no
                // cell-changed highlight from before this save can
                // possibly linger — setColumns alone doesn't guarantee
                // that for classes added directly via classList.
                this.tableReady
                    .then(() => this.tabulator.replaceData(JSON.parse(JSON.stringify(this.originalRows))))
                    .then(() => this.rebuildColumns());

                // One bulk_save_table_rows call per logical table (this
                // table's own changes, plus a second one only if there are
                // pending enum-option edits) instead of one
                // save_table_row/delete_table_row call per dirty row — N
                // concurrent requests each fighting over the same global
                // script lock is exactly what made a large batch start
                // timing out (see DECISIONS.md). Same per-row failure
                // granularity as before, just read from res.results
                // instead of one Promise.all entry per row.
                const tableName = this.tableName;
                const toChange = (key, d) => ({ key: key, isNew: !!d.isNew, isDelete: !!d.isDelete, row: d.data });
                const batches = [];
                if (entries.length) {
                    batches.push(
                        apiCall("bulk_save_table_rows", {
                            table: tableName,
                            changes: entries.map(([key, d]) => toChange(key, d)),
                        }).then((res) => ({ table: tableName, res: res })),
                    );
                }
                if (enumEntries.length) {
                    batches.push(
                        apiCall("bulk_save_table_rows", {
                            table: "enum_option",
                            changes: enumEntries.map(([key, d]) => toChange(key, d)),
                        }).then((res) => ({ table: "enum_option", res: res })),
                    );
                }

                Promise.all(batches).then((batchResults) => {
                    const failures = [];
                    batchResults.forEach((br) => {
                        if (!br.res.ok) {
                            failures.push({ table: br.table, error: br.res.error || "Unknown error" });
                            return;
                        }
                        (br.res.results || []).forEach((r) => {
                            if (!r.ok) failures.push({ table: br.table, error: (r.key || "") + ": " + (r.error || "Unknown error") });
                        });
                    });
                    if (!failures.length) return;

                    const message =
                        "Some changes could not be saved:\n" +
                        failures.map((f) => f.table + ": " + f.error).join("\n") +
                        "\n\nReload to see the table's real current state.";
                    if (!this.destroyed) {
                        this.showTableSaveError(message);
                    } else {
                        // Already torn down by the time this came back —
                        // the takeover above wouldn't even be visible, so
                        // at least don't let the failure go by completely
                        // silently.
                        alert(message + "\n\n(You've since switched away from " + tableName + ".)");
                    }
                });
            }

            // --- Filtering ---------------------------------------------------

            /**
             * Single combined filter (free-text search + every active
             * per-column filter), passed to Tabulator as one function
             * rather than juggling multiple setFilter calls. Reference-type
             * searchable columns match against the resolved label (e.g.
             * product name), same lookup already used for display and
             * sorting — not the raw stored id.
             */
            rowMatchesFilters(row) {
                // A row queued for delete (single ❌ or bulk — see
                // queueRowDelete_) is hidden via this same filter mechanism
                // rather than a direct Tabulator row.delete() call — one
                // cheap setFilter() covers hiding any number of rows at
                // once instead of N separate row mutations.
                const dirtyEntry = this.dirty[this.rowKeyStr(row)];
                if (dirtyEntry && dirtyEntry.isDelete) return false;
                if (this.searchText) {
                    const matches = this.schema.filter((f) => f.searchable === true).some((f) => {
                        let val = row[f.column_name];
                        if (f.type === "reference") {
                            const cache = REF_CACHES[f.ref_table] || {};
                            val = cache[val] ? cache[val][f.ref_label_field] : val;
                        } else if (f.type === "enum_list") {
                            val = enumListLabel(val, ENUM_CACHES[f.enum_source] || []);
                        }
                        return String(val ?? "").toLowerCase().includes(this.searchText);
                    });
                    if (!matches) return false;
                }
                // Every active column filter must match (AND) — the
                // free-text box above is deliberately an OR-across-columns
                // quick search, this is its precise per-column complement.
                for (const columnName in this.columnFilters) {
                    const f = this.schema.find((s) => s.column_name === columnName);
                    if (f && !columnFilterMatches(f, row[columnName], this.columnFilters[columnName])) {
                        return false;
                    }
                }
                return true;
            }

            /**
             * Adds a filter icon into the header of every searchable
             * column, wired to open that column's filter popup — done via
             * direct DOM manipulation (tabulator.getColumn(...).getElement())
             * rather than Tabulator's titleFormatter, since that requires
             * re-running after every setColumns() rebuild (Edit/Cancel/Save
             * all trigger one) — called explicitly at each of those call
             * sites once the rebuild has actually settled, same
             * tableReady-gated pattern as everything else that touches
             * this instance's Tabulator structure.
             */
            attachColumnFilterIcons() {
                this.schema.filter((f) => f.searchable === true).forEach((f) => {
                    const col = this.tabulator.getColumn(f.column_name);
                    if (!col) return;
                    const headerEl = col.getElement();
                    const titleEl = headerEl.querySelector(".tabulator-col-title");
                    if (!titleEl || titleEl.querySelector(".col-filter-icon")) return;
                    const isActive = !!this.columnFilters[f.column_name];
                    headerEl.classList.toggle("col-header-filtered", isActive);
                    const btn = document.createElement("span");
                    btn.className = "col-filter-icon" + (isActive ? " is-active" : "");
                    btn.innerHTML = COLUMN_FILTER_ICON_SVG;
                    btn.title = "Filter " + (f.label || f.column_name);
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        this.openColumnFilterPopup(f, btn);
                    });
                    titleEl.appendChild(btn);
                });
            }

            /** Sets/clears this instance's columnFilters for one column,
             * re-applies the combined filter, and updates just that
             * column's icon/header styling — no full column rebuild needed
             * for this part. */
            applyColumnFilter(f, result) {
                if (result) {
                    this.columnFilters[f.column_name] = result;
                } else {
                    delete this.columnFilters[f.column_name];
                }
                this.tableReady
                    .then(() => this.tabulator.setFilter((row) => this.rowMatchesFilters(row)))
                    .then(() => this.updateSelectAllCheckbox_());
                const col = this.tabulator.getColumn(f.column_name);
                if (!col) return;
                const headerEl = col.getElement();
                headerEl.classList.toggle("col-header-filtered", !!result);
                const icon = headerEl.querySelector(".col-filter-icon");
                if (icon) icon.classList.toggle("is-active", !!result);
            }

            /**
             * Small floating popup anchored under a column's filter icon,
             * with a form shaped by the column's type (see the individual
             * buildXFilterForm functions) plus shared Apply/Clear actions.
             */
            openColumnFilterPopup(f, anchorEl) {
                document.querySelectorAll(".col-filter-popup, .enum-manage-popup").forEach((el) => el.remove());

                const popup = document.createElement("div");
                popup.className = "col-filter-popup";

                const state = this.columnFilters[f.column_name];
                let getResult;
                if (f.type === "integer" || f.type === "decimal" || f.type === "money") {
                    getResult = buildNumberFilterForm(popup, state);
                } else if (f.type === "date") {
                    getResult = buildDateFilterForm(popup, state);
                } else if (f.type === "boolean") {
                    getResult = buildBooleanFilterForm(popup, state);
                } else if (f.type === "enum" || f.type === "enum_list") {
                    getResult = buildEnumFilterForm(popup, f, state);
                } else if (f.type === "reference" && referenceOptionCount_(f) > 0 && referenceOptionCount_(f) <= REFERENCE_CHECKLIST_MAX_OPTIONS) {
                    getResult = buildReferenceFilterForm(popup, f, state);
                } else {
                    getResult = buildTextFilterForm(popup, state);
                }

                const actions = document.createElement("div");
                actions.className = "col-filter-actions";
                const clearBtn = document.createElement("button");
                clearBtn.type = "button";
                clearBtn.className = "col-filter-clear";
                clearBtn.textContent = "Clear";
                const applyBtn = document.createElement("button");
                applyBtn.type = "button";
                applyBtn.className = "dash-btn col-filter-apply";
                applyBtn.textContent = "Apply";
                actions.append(clearBtn, applyBtn);
                popup.appendChild(actions);

                const close = makeFloatingPopup(popup, anchorEl);
                clearBtn.addEventListener("click", () => {
                    this.applyColumnFilter(f, null);
                    close();
                });
                applyBtn.addEventListener("click", () => {
                    this.applyColumnFilter(f, getResult());
                    close();
                });
            }

            /**
             * Gear icon for columns explicitly opted in via field_schema's
             * manage_options — deliberately not automatic for every enum
             * column (most fixed vocabularies shouldn't invite casual
             * editing the way a genuinely owner-managed list should).
             * Opens a popup to add/reorder/activate-deactivate that
             * column's enum_source options.
             */
            attachColumnManageIcons() {
                // Editing enum_option is a change to what a column's cells
                // can even contain — only meaningful, and only offered,
                // while actually in Edit mode, same as every other write
                // action here.
                if (!this.editMode) return;
                const manageable = this.schema.filter(
                    (f) => (f.type === "enum" || f.type === "enum_list") && f.manage_options === true,
                );
                // Fire-and-forget prefetch: by the time any gear icon
                // actually gets clicked, the fetch has very likely already
                // resolved (or is already in flight, in which case
                // openEnumManagePopup's own call just joins it), so the
                // popup opens from cache even the very first time, not
                // just on subsequent opens.
                if (manageable.length) loadEnumOptionRows_();
                manageable.forEach((f) => {
                    const col = this.tabulator.getColumn(f.column_name);
                    if (!col) return;
                    const titleEl = col.getElement().querySelector(".tabulator-col-title");
                    if (!titleEl || titleEl.querySelector(".col-manage-icon")) return;
                    const btn = document.createElement("span");
                    btn.className = "col-manage-icon";
                    btn.innerHTML = COLUMN_MANAGE_ICON_SVG;
                    btn.title = "Manage options for " + (f.label || f.column_name);
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openEnumManagePopup(f, btn);
                    });
                    titleEl.appendChild(btn);
                });
            }

            // --- Grid columns / row edits -------------------------------------

            buildColumns() {
                // hidden=TRUE columns still exist in the row data (settable
                // via the add modal, sent on save) — just not rendered as
                // a grid column. Covers things like a table's own raw id
                // (nothing to resolve it to, unlike a foreign key such as
                // product_id). A scoped instance's own join column back to
                // its parent (see parentScope) is hidden dynamically here,
                // not via a static hidden=TRUE schema flag — the same
                // child table could plausibly be embedded under more than
                // one parent later, each with a different join column that
                // should only be hidden when actually viewed scoped to
                // that specific parent.
                // type=sub_table rows are synthetic (see field_schema.type)
                // and should already carry hidden=TRUE by convention — the
                // explicit exclusion here is belt-and-suspenders so a
                // future schema edit that forgets that flag can't leak a
                // synthetic row into the grid as a real column.
                const visibleSchema = this.schema.filter(
                    (f) =>
                        f.hidden !== true &&
                        f.type !== "sub_table" &&
                        !(this.parentScope && f.column_name === this.parentScope.column),
                );

                const dataColumns = visibleSchema.map((f) => {
                    const editable = this.editMode && f.editable_on_update === true;
                    const isNumeric = f.type === "integer" || f.type === "decimal" || f.type === "money";
                    // A real default width per type, not just a minWidth
                    // floor — layout is "fitDataFill" (see renderGrid), not
                    // "fitColumns", so tables with few columns still
                    // stretch to fill the box (via an invisible filler
                    // column, not by inflating real ones), but a table
                    // with enough columns to need more room than the box
                    // has just scrolls horizontally instead of every
                    // column getting squeezed to fit.
                    let width = 160; // text/reference/enum/enum_list default
                    let minWidth = 120;
                    if (f.type === "boolean") {
                        width = 70;
                        minWidth = 60;
                    } else if (f.type === "date") {
                        width = 110;
                        minWidth = 100;
                    } else if (isNumeric) {
                        width = 100;
                        minWidth = 80;
                    }
                    const col = {
                        title: f.label || f.column_name,
                        field: f.column_name,
                        editable: editable,
                        validator: fieldValidator(f),
                        width: width,
                        minWidth: minWidth,
                    };
                    // The highlight color IS the "this is editable" signal
                    // — no separate label needed.
                    if (editable) col.cssClass = "editable-cell";

                    if (f.type === "reference") {
                        col.formatter = (cell) => formatCellValue(f, cell.getValue());
                        // Default sort would compare raw ids (K01 vs K02)
                        // — sort by the same label the column actually
                        // displays.
                        col.sorter = (a, b) =>
                            String(formatCellValue(f, a)).localeCompare(String(formatCellValue(f, b)));
                    } else if (f.type === "enum") {
                        const options = ENUM_CACHES[f.enum_source] || [];
                        col.formatter = (cell) => formatCellValue(f, cell.getValue());
                        col.sorter = (a, b) =>
                            String(formatCellValue(f, a)).localeCompare(String(formatCellValue(f, b)));
                        if (editable) {
                            col.editor = "list";
                            col.editorParams = {
                                values: options.reduce((acc, o) => {
                                    acc[o.value] = o.label;
                                    return acc;
                                }, {}),
                            };
                        }
                    } else if (f.type === "enum_list") {
                        const options = ENUM_CACHES[f.enum_source] || [];
                        col.formatter = (cell) => formatCellValue(f, cell.getValue());
                        if (editable) {
                            col.editor = enumListEditor;
                            col.editorParams = { options: options };
                        }
                    } else if (isNumeric) {
                        col.hozAlign = "right";
                        if (f.type === "money") {
                            col.formatter = (cell) => formatCellValue(f, cell.getValue());
                        }
                        if (editable) {
                            col.editor = "number";
                            const params = {};
                            if (f.min !== "" && f.min !== null && f.min !== undefined) params.min = Number(f.min);
                            if (f.max !== "" && f.max !== null && f.max !== undefined) params.max = Number(f.max);
                            if (f.type === "integer") params.step = 1;
                            col.editorParams = params;
                        }
                    } else if (f.type === "boolean") {
                        // A real toggle switch, not Tabulator's built-in
                        // tickCross editor — that one needs a click to
                        // turn the cell into a checkbox, then a second
                        // click plus a blur just to see the tick/cross
                        // again. This flips on one click instead, same as
                        // the delete button's cellClick.
                        col.hozAlign = "center";
                        col.editable = false;
                        col.formatter = (cell) => {
                            const on = cell.getValue() === true;
                            return (
                                '<span class="bool-switch' +
                                (on ? " is-on" : "") +
                                (editable ? "" : " is-disabled") +
                                '"></span>'
                            );
                        };
                        if (editable) {
                            col.cellClick = (e, cell) => {
                                e.stopPropagation();
                                cell.setValue(cell.getValue() !== true);
                                this.markRowDirty(cell);
                            };
                        }
                    } else if (f.type === "date") {
                        if (editable) col.editor = "date";
                    } else {
                        if (editable) col.editor = "input";
                    }

                    // The designated title column gets a click-to-open
                    // detail link, but only in view mode (tied to the
                    // whole grid's editMode, not this column's own
                    // editable flag — a title column that happens not to
                    // be editable_on_update shouldn't keep the link active
                    // while the rest of the grid is mid-edit) and only for
                    // tables that opted in via table_schema.has_detail_view.
                    if (f.is_title_column === true && this.meta.has_detail_view === true && !this.editMode) {
                        const baseFormatter = col.formatter || ((cell) => cell.getValue());
                        col.formatter = (cell) => '<span class="row-detail-link">' + baseFormatter(cell) + "</span>";
                        col.cellClick = (e, cell) => {
                            e.stopPropagation();
                            this.openDetailView(cell.getRow());
                        };
                    }
                    return col;
                });
                return this.buildBulkDeleteColumn().concat(dataColumns, this.buildDeleteColumn());
            }

            /**
             * A leading checkbox column for multi-row selection — only
             * present under the exact same condition as buildDeleteColumn
             * (Edit mode + hard_delete), since it exists purely to feed
             * handleBulkDelete. Per-row checkboxes use Tabulator's built-in
             * "rowSelection" formatter (getSelectedRows() etc.) — no custom
             * cellClick, since that formatter wires up its own checkbox
             * click handling internally and adding one here too would
             * toggle the row twice per click. The HEADER "select all"
             * checkbox is custom, not Tabulator's stock titleFormatter:
             * Tabulator's own select-all selects every row in the table's
             * data regardless of the active filter, which would silently
             * bulk-select rows the admin can't even see. This one only
             * ever acts on this.tabulator.getRows("active") — rows
             * currently passing the grid's filter (see rowMatchesFilters),
             * not "visible" (viewport-scrolled) and not every row.
             */
            buildBulkDeleteColumn() {
                if (!this.editMode || this.meta.hard_delete !== true) return [];
                return [
                    {
                        title: "",
                        field: "__select",
                        width: 40,
                        hozAlign: "center",
                        headerSort: false,
                        headerHozAlign: "center",
                        formatter: "rowSelection",
                        cellClick: (e) => e.stopPropagation(),
                        titleFormatter: () => {
                            const cb = document.createElement("input");
                            cb.type = "checkbox";
                            cb.className = "select-all-checkbox";
                            cb.addEventListener("click", (e) => {
                                e.stopPropagation();
                                const activeRows = this.tabulator.getRows("active");
                                const allSelected = activeRows.length > 0 && activeRows.every((r) => r.isSelected());
                                if (allSelected) this.tabulator.deselectRow(activeRows);
                                else this.tabulator.selectRow(activeRows);
                            });
                            this.selectAllCheckboxEl = cb;
                            this.updateSelectAllCheckbox_();
                            return cb;
                        },
                    },
                ];
            }

            /**
             * A trailing delete-button column — only present in Edit mode,
             * and only for a hard_delete table (see table_schema). A table
             * without hard_delete doesn't get this column at all:
             * "deleting" there just means unchecking its ordinary active
             * column, which is already a normal editable cell — no
             * dedicated button needed.
             */
            buildDeleteColumn() {
                if (!this.editMode || this.meta.hard_delete !== true) return [];
                return [
                    {
                        title: "",
                        field: "__delete",
                        width: 50,
                        hozAlign: "center",
                        headerSort: false,
                        formatter: () => '<span class="row-delete-btn" title="Delete row">❌</span>',
                        cellClick: (e, cell) => {
                            e.stopPropagation();
                            this.handleDeleteRow(cell.getRow());
                        },
                    },
                ];
            }

            /**
             * Opens the detail view for one row — the title-column link's
             * target. Two independent pieces, both scoped to just this
             * modal: the parent row's own fields (buildParentFieldsEditor)
             * and one embedded DataGrid instance per declared sub_table
             * child, each with its own edit/save/cancel.
             *
             * @param {Object} rowComponent - Tabulator RowComponent for
             *   the row being opened.
             * @param {Object} [opts]
             * @param {boolean} [opts.pushUrl=true] - false only for the
             *   page's own initial-load auto-open (see bootstrap below) —
             *   the URL already points here, nothing to push.
             */
            openDetailView(rowComponent, opts) {
                const pushUrl = !opts || opts.pushUrl !== false;
                const rowData = rowComponent.getData();
                // Single-column parent keys only — see the sub_table
                // documentation in database_schema.md.
                const pkField = this.keyFields[0];
                const rowId = rowData[pkField.column_name];
                const detailUrl = "/dashboard/tables/" + this.tableName + "/detail/" + rowId;
                if (pushUrl) history.pushState(null, "", detailUrl);

                const overlay = document.createElement("div");
                overlay.className = "modal-overlay";
                const box = document.createElement("div");
                box.className = "modal-box detail-modal-box";
                overlay.appendChild(box);

                const title = document.createElement("h3");
                title.textContent = this.meta.label || this.tableName;
                box.appendChild(title);

                const parentSection = document.createElement("div");
                box.appendChild(parentSection);
                const parentEditor = buildParentFieldsEditor(parentSection, {
                    tableName: this.tableName,
                    schema: this.schema,
                    keyFields: this.keyFields,
                    rowData: rowData,
                    onSaved: (updatedRow) => {
                        // Keep the underlying grid in sync with a save that
                        // happened independently, via this modal — both the
                        // visible cells (rowComponent.update) and this
                        // instance's own revert baseline (originalRows),
                        // so a later Cancel in the outer grid doesn't
                        // clobber this save by reverting to pre-modal data.
                        rowComponent.update(updatedRow);
                        const key = this.rowKeyStr(updatedRow);
                        const idx = this.originalRows.findIndex((r) => this.rowKeyStr(r) === key);
                        if (idx !== -1) this.originalRows[idx] = Object.assign({}, updatedRow);
                    },
                });

                // One independent DataGrid instance per declared child —
                // rendered from whatever prefetchSubTableChildren_ already
                // fetched (or is still fetching; the .then below just
                // joins that same in-flight promise), so opening this
                // view never waits on a fresh round trip for data that
                // was already known to be needed the moment the parent
                // table's own schema loaded.
                const childInstances = [];
                this.schema
                    .filter((f) => f.type === "sub_table")
                    .forEach((f) => {
                        const section = document.createElement("div");
                        section.className = "detail-subtable-section";
                        const heading = document.createElement("h4");
                        heading.textContent = f.label || f.sub_table;
                        section.appendChild(heading);
                        const mount = document.createElement("div");
                        mount.className = "detail-subtable-mount";
                        // Placeholder text for the (usually brief) gap
                        // before the prefetch resolves — almost always
                        // already settled by the time this renders, since
                        // it was kicked off back when the parent table's
                        // own schema first loaded, but not guaranteed if
                        // the admin opens this modal right away.
                        mount.textContent = "Loading…";
                        section.appendChild(mount);
                        box.appendChild(section);

                        const childTable = f.sub_table;
                        const fetchPromise = CHILD_TABLE_CACHE[childTable] || Promise.resolve(null);
                        fetchPromise.then((res) => {
                            mount.textContent = "";
                            if (!res) {
                                mount.textContent = "Could not load.";
                                return;
                            }
                            const child = new DataGrid({
                                container: mount,
                                tableName: childTable,
                                parentScope: { column: f.sub_table_join_column, value: rowData[pkField.column_name] },
                            });
                            child.renderFromData(res);
                            childInstances.push(child);
                        });
                    });

                const closeBtn = document.createElement("button");
                closeBtn.className = "dash-btn detail-modal-close";
                closeBtn.textContent = "Close";
                box.appendChild(closeBtn);

                document.body.appendChild(overlay);

                const modalHasUnsavedChanges = () =>
                    parentEditor.hasUnsavedChanges() || childInstances.some((c) => c.hasUnsavedChanges());

                // Pure DOM teardown, no history write — used both by this
                // modal's own explicit close (see closeViaButton, which
                // writes history itself before calling this) and by
                // external callers (activateTable switching tables,
                // popstate on browser Back) where the URL is either
                // already correct or about to be overwritten by the
                // caller's own navigation, so writing it here too would
                // just race or duplicate that.
                const forceClose = () => {
                    childInstances.forEach((c) => c.destroy());
                    overlay.remove();
                    ACTIVE_DETAIL_MODAL = null;
                };
                const closeViaButton = () => {
                    const proceed = () => {
                        forceClose();
                        history.replaceState(null, "", "/dashboard/tables/" + ACTIVE_TABLE);
                    };
                    if (modalHasUnsavedChanges()) {
                        confirmModal("Discard unsaved changes?").then((yes) => yes && proceed());
                    } else {
                        proceed();
                    }
                };
                closeBtn.addEventListener("click", closeViaButton);
                overlay.addEventListener("mousedown", (e) => {
                    if (e.target === overlay) closeViaButton();
                });

                ACTIVE_DETAIL_MODAL = {
                    hasUnsavedChanges: modalHasUnsavedChanges,
                    forceClose: forceClose,
                    url: detailUrl,
                };
            }

            /**
             * Queues a delete into this.dirty, same as a cell edit — only
             * actually sent to the backend when Save is clicked (see
             * saveDirtyRows). A row that was itself added-but-not-yet-saved
             * this session just gets dropped from this.dirty entirely
             * instead: the server has never heard of it, so there's
             * nothing to tell it to delete. Shared by both the single-row
             * ❌ button (handleDeleteRow) and bulk delete
             * (handleBulkDelete) — each owns its own confirm-modal wording,
             * this is just the marking. Doesn't touch the Tabulator row
             * itself (no row.delete()) — the caller hides queued-delete
             * rows via one setFilter() afterward instead (see
             * rowMatchesFilters), so marking N rows here costs nothing
             * visible until that one shared refresh, rather than N separate
             * Tabulator row mutations.
             */
            queueRowDelete_(rowComponent) {
                const rowData = rowComponent.getData();
                const key = this.rowKeyStr(rowData);
                const isUnsavedNewRow = this.dirty[key] && this.dirty[key].isNew;
                if (isUnsavedNewRow) {
                    delete this.dirty[key];
                } else {
                    this.dirty[key] = { isNew: false, isDelete: true, data: rowData };
                }
            }

            handleDeleteRow(rowComponent) {
                const rowData = rowComponent.getData();
                const key = this.rowKeyStr(rowData);
                const isUnsavedNewRow = this.dirty[key] && this.dirty[key].isNew;
                const message = isUnsavedNewRow
                    ? "Remove this not-yet-saved row?"
                    : "Delete this row? Won't happen until you hit Save.";
                confirmModal(message, isUnsavedNewRow ? "Remove" : "Delete").then((yes) => {
                    if (!yes) return;
                    this.queueRowDelete_(rowComponent);
                    // In case this row also happened to be bulk-select
                    // checked — same reasoning as handleBulkDelete's
                    // deselectRow call.
                    if (rowComponent.isSelected && rowComponent.isSelected()) this.tabulator.deselectRow(rowComponent);
                    this.tabulator.setFilter((row) => this.rowMatchesFilters(row));
                    this.updateToolbarButtons();
                    this.updateSelectAllCheckbox_();
                });
            }

            /**
             * Same queuing as a single ❌ click, just for every currently
             * checked row (buildBulkDeleteColumn) at once, behind one
             * confirm instead of one per row, and one setFilter() refresh
             * instead of N — see queueRowDelete_.
             */
            handleBulkDelete() {
                const rows = this.tabulator.getSelectedRows();
                if (!rows.length) return;
                const allUnsavedNew = rows.every((r) => {
                    const key = this.rowKeyStr(r.getData());
                    return this.dirty[key] && this.dirty[key].isNew;
                });
                const message = allUnsavedNew
                    ? "Remove " + rows.length + " not-yet-saved row(s)?"
                    : "Delete " + rows.length + " row(s)? Won't happen until you hit Save.";
                confirmModal(message, allUnsavedNew ? "Remove" : "Delete").then((yes) => {
                    if (!yes) return;
                    rows.forEach((r) => this.queueRowDelete_(r));
                    // Deselect explicitly — these rows are only hidden by
                    // the filter now (queueRowDelete_ no longer removes
                    // them from Tabulator's data), so without this they'd
                    // still count as "selected" while just invisible,
                    // leaving a stale count behind for the next selection.
                    this.tabulator.deselectRow(rows);
                    this.tabulator.setFilter((row) => this.rowMatchesFilters(row));
                    this.updateToolbarButtons();
                    this.updateSelectAllCheckbox_();
                });
            }

            // A row already queued as new stays new — only default to
            // "existing" the first time this key is touched.
            markRowDirty(cell) {
                const rowData = cell.getRow().getData();
                const key = this.rowKeyStr(rowData);
                const wasNew = !!(this.dirty[key] && this.dirty[key].isNew);
                const original = wasNew ? null : this.findOriginalRow(key);

                // Per-cell highlight: did THIS field actually change from
                // its last-saved value? A separate signal from the
                // "editable-cell" yellow (which just means "you're
                // allowed to edit this") — a row can have one touched
                // cell and five untouched ones, each reflecting its own
                // state independently of row-level dirty tracking below.
                const field = cell.getField();
                const changed =
                    wasNew || !original || String(cell.getValue() ?? "") !== String(original[field] ?? "");
                cell.getElement().classList.toggle("cell-changed", changed);

                if (!wasNew && original && rowsEqual(rowData, original)) {
                    // Every field is back to what the server last returned
                    // — not a pending change anymore, e.g. toggling a
                    // switch back to where it started.
                    delete this.dirty[key];
                } else {
                    this.dirty[key] = { isNew: wasNew, data: rowData };
                }
                this.updateToolbarButtons();
            }

            renderGrid(rows) {
                this.tableReady = new Promise((resolve) => {
                    this.tabulator = new Tabulator(this.gridEl, {
                        // Deep-cloned, not the same row objects
                        // originalRows holds — Tabulator mutates row data
                        // objects in place on every edit (no reactiveData
                        // proxy in use here), so handing it the exact same
                        // references originalRows pointed at would
                        // silently corrupt the "original" baseline with
                        // every edit. That's what made markRowDirty's
                        // revert-detection compare a value against itself
                        // (always "unchanged") and made Cancel "revert" to
                        // whatever was last typed instead of the true
                        // original.
                        data: JSON.parse(JSON.stringify(rows)),
                        // Columns keep their own default width (see
                        // buildColumns) and only grow past it to fill
                        // genuinely leftover space — via an invisible
                        // filler column, not by stretching real ones
                        // ("fitColumns" used to force every column to fit
                        // the box regardless of column count, making a
                        // 3-column table look absurdly wide and a
                        // 12-column one uncomfortably cramped).
                        layout: "fitDataFill",
                        height: "100%",
                        // Needed for the rowSelection formatter/getSelectedRows()
                        // used by buildBulkDeleteColumn — harmless when that
                        // column isn't present (view mode, non-hard_delete
                        // tables), just an unused capability then.
                        selectableRows: true,
                        columns: this.buildColumns(),
                    });
                    // .on(), not a constructor-option callback — checked
                    // the actual Tabulator source: "cellEdited" is only
                    // ever registered as a per-column option there
                    // (registerColumnOption), never read as a table-level
                    // constructor callback, so it was silently never
                    // firing at all. .on() is the public, always-correct
                    // API for both of these regardless of that —
                    // registering a listener is synchronous and safe to
                    // do right after construction no matter when the
                    // table actually finishes building, since the events
                    // themselves can only dispatch strictly later than
                    // that.
                    this.tabulator.on("cellEdited", (cell) => this.markRowDirty(cell));
                    this.tabulator.on("rowSelectionChanged", () => {
                        this.updateToolbarButtons();
                        this.updateSelectAllCheckbox_();
                    });
                    this.tabulator.on("tableBuilt", () => {
                        this.tabulator.setFilter((row) => this.rowMatchesFilters(row));
                        this.attachColumnFilterIcons();
                        this.attachColumnManageIcons();
                        resolve();
                    });
                });
            }

            // --- Add-new modal -------------------------------------------------

            openAddModal() {
                const valueFields = this.schema.filter(
                    (f) =>
                        f.editable_on_create === true &&
                        !this.keyFields.includes(f) &&
                        !(this.parentScope && f.column_name === this.parentScope.column),
                );
                const formState = {};
                // A non-reference key (a table's own id, e.g. user_id) is
                // generated right here, once — never asked for, and the
                // row's real identity is known immediately, no server
                // round trip needed to find out what it ended up being.
                this.keyFields.filter((f) => f.type !== "reference").forEach((f) => {
                    formState[f.column_name] = crypto.randomUUID();
                });
                // A grid scoped to a specific parent row (see
                // parentScope) auto-fills its join column and never asks
                // for it again — that's the whole point of already being
                // scoped to one parent.
                if (this.parentScope) formState[this.parentScope.column] = this.parentScope.value;

                const overlay = document.createElement("div");
                overlay.className = "modal-overlay";
                const box = document.createElement("div");
                box.className = "modal-box";
                box.innerHTML = "<h3>Add row</h3>";
                overlay.appendChild(box);

                if (this.parentScope) {
                    const scopeField = this.schema.find((f) => f.column_name === this.parentScope.column);
                    let display = this.parentScope.value;
                    if (scopeField && scopeField.type === "reference") {
                        const cache = REF_CACHES[scopeField.ref_table] || {};
                        const row = cache[this.parentScope.value];
                        display = row ? row[scopeField.ref_label_field] : this.parentScope.value;
                    }
                    const info = document.createElement("div");
                    info.className = "modal-field";
                    info.innerHTML =
                        "<label>" +
                        (scopeField ? scopeField.label || scopeField.column_name : this.parentScope.column) +
                        "</label><div>" +
                        display +
                        "</div>";
                    box.appendChild(info);
                }

                const visibleKeyFields = this.keyFields.filter(
                    (f) => !(this.parentScope && f.column_name === this.parentScope.column),
                );
                const referenceKeyFields = visibleKeyFields.filter((f) => f.type === "reference");

                // Includes rows currently hidden by an active filter, and
                // any row already added-but-unsaved in this edit session —
                // both are real "already used" combinations. Only
                // meaningful for reference-type key columns (a picker with
                // a fixed candidate list) — a plain text key like a
                // hand-typed id has no list to filter; the backend still
                // rejects a duplicate on save.
                const usedCombos = () => this.tabulator.getData();

                const norm = (v) => String(v ?? "").trim();

                const optionsFor = (field) => {
                    const cache = REF_CACHES[field.ref_table] || {};
                    return Object.keys(cache).filter((id) => {
                        return !usedCombos().some((row) =>
                            this.keyFields.every((kf) => {
                                const candidate = kf.column_name === field.column_name ? id : formState[kf.column_name];
                                return norm(row[kf.column_name]) === norm(candidate);
                            }),
                        );
                    });
                };

                // Non-reference key fields (e.g. user_id) get no UI at all
                // — they're always server-generated (see saveTableRow),
                // never asked for. Only a reference-type key (a real
                // foreign key the admin must pick, e.g. kiosk_id/
                // product_id) needs a picker — same searchable/sortable
                // widget the staff forms already use for product pickers,
                // instead of a plain <select>. Its options are recomputed
                // fresh on every focus/keystroke (see getItems below), so
                // — unlike a plain <select> — nothing needs to be manually
                // rebuilt when a sibling field changes; each picker just
                // reflects current formState whenever it's actually used.
                referenceKeyFields.forEach((f) => {
                    const wrap = document.createElement("div");
                    wrap.className = "modal-field";
                    const label = document.createElement("label");
                    label.textContent = f.label || f.column_name;
                    wrap.appendChild(label);
                    const pickWrap = document.createElement("div");
                    wrap.appendChild(pickWrap);
                    box.appendChild(wrap);

                    const cache = REF_CACHES[f.ref_table] || {};
                    makeSearchPick(pickWrap, {
                        placeholder: "Search " + (f.label || f.column_name).toLowerCase() + "…",
                        getItems: (q) =>
                            optionsFor(f)
                                .map((id) => ({
                                    id: id,
                                    label: cache[id] ? cache[id][f.ref_label_field] : id,
                                }))
                                .filter((it) => !q || it.label.toLowerCase().includes(q))
                                .sort((a, b) => a.label.localeCompare(b.label)),
                        onSelect: (item) => {
                            formState[f.column_name] = item.id;
                        },
                    });
                });

                valueFields.forEach((f) => {
                    const wrap = document.createElement("div");
                    wrap.className = "modal-field";
                    const label = document.createElement("label");
                    label.textContent = f.label || f.column_name;
                    wrap.appendChild(label);
                    wrap.appendChild(
                        buildFieldInput(f, formState[f.column_name], (val) => {
                            formState[f.column_name] = val;
                        }),
                    );
                    box.appendChild(wrap);
                });

                const errorEl = document.createElement("div");
                errorEl.className = "modal-error";
                box.appendChild(errorEl);

                const actions = document.createElement("div");
                actions.className = "modal-actions";
                actions.innerHTML =
                    '<button class="dash-btn" style="background:var(--line);color:var(--ink)" id="modalCancel">Cancel</button>' +
                    '<button class="dash-btn" id="modalSave">Add</button>';
                box.appendChild(actions);

                document.body.appendChild(overlay);

                box.querySelector("#modalCancel").addEventListener("click", () => overlay.remove());
                box.querySelector("#modalSave").addEventListener("click", () => {
                    const missing = this.keyFields.concat(valueFields).find(
                        (f) => f.required === true && !formState[f.column_name],
                    );
                    if (missing) {
                        errorEl.textContent = (missing.label || missing.column_name) + " is required.";
                        return;
                    }
                    this.tabulator.addRow(formState);
                    this.dirty[this.rowKeyStr(formState)] = { isNew: true, data: Object.assign({}, formState) };
                    this.updateToolbarButtons();
                    overlay.remove();
                });
            }
        }
    </script>
</body>
</html>
