<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍣</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Data Tables</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/dashboard.css" />
    <link
        rel="stylesheet"
        href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css"
    />
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
</head>
<body>
    <div class="dash-shell">
        <nav class="dash-sidebar" id="dashSidebar"></nav>

        <!-- Hidden until initDashboard() confirms access. -->
        <main class="dash-main" id="dashMain" style="display: none">
            <div class="dash-content">
                <div class="table-tabs" id="tableTabs" style="display: none"></div>
                <h1 id="pageTitle"></h1>
                <p id="pageDesc" style="color: var(--muted)"></p>
                <!-- Covers the page's very first load only — before
                     bootstrap_tables_page resolves, pageGridMount is still
                     empty (no DataGrid instance exists yet to show its own
                     spinner). Hidden once that first response arrives; every
                     later load (tab switch, reload) is covered by the
                     DataGrid instance's own spinnerEl instead, per its
                     _buildScaffold. Kept as a sibling of pageGridMount, not
                     inside it — that div's own comment below says it's
                     "owned entirely" by the DataGrid instance, which appends
                     rather than clears on construction. -->
                <div class="dash-spinner" id="pageLoadSpinner"></div>
                <!-- Owned entirely by the page-level DataGrid instance (see
                     the inline script) — it builds its own toolbar/spinner/
                     grid sub-elements into this one mount, exactly the same
                     way a future modal-embedded child grid gets its own
                     mount div. -->
                <div class="dash-grid-mount" id="pageGridMount"></div>
            </div>
        </main>
    </div>

    <script src="/assets/common.js"></script>
    <script src="/assets/dashboard-common.js"></script>
    <script src="/assets/search-pick.js"></script>
    <script>
        // Which tables exist and their tab labels — see table_schema in
        // database_schema.md. Fetched once. Switching tabs always refetches
        // row data fresh, but schema/references/enums are cached (below)
        // once loaded, so revisiting a table already seen this session is
        // just one API call instead of several.
        let TABLES_LIST = [];
        let ACTIVE_TABLE = "";
        // The single page-level grid instance — destroyed and replaced
        // whenever the active tab changes (see activateTable). A detail
        // modal instantiates its own DataGrid instances the same way,
        // independent of this one.
        let PAGE_GRID = null;
        // { hasUnsavedChanges(), forceClose() } for whichever detail modal
        // is currently open, or null. Set/cleared by DataGrid#openDetailView.
        // Lets the page-level unsaved-changes guard (tab switching,
        // beforeunload) see into an open modal's parent-fields editor and
        // child grids without those being DataGrid/page-level state
        // themselves.
        let ACTIVE_DETAIL_MODAL = null;

        // Cached for the whole session (cleared only by a real page
        // reload) — schema/reference/enum data rarely changes mid-session,
        // and re-fetching it on every tab switch was the expensive part
        // (a chain of several GAS round trips). Row data is NOT cached
        // here — always fetched fresh, since it's the part most likely to
        // actually change, and it's cheap on its own (one call). Shared by
        // every DataGrid instance on the page, not per-instance state.
        let SCHEMA_CACHE = {}; // table_name -> fields[]
        let REF_CACHES = {}; // ref_table -> { id: fullRow }
        let ENUM_CACHES = {}; // enum_source -> [{value, label}]
        // table_name -> that table's own table_schema row (label,
        // description, hard_delete, has_detail_view, type). Every
        // bootstrap_data_table response is self-describing (includes the
        // table's own meta) so this works identically for the page-level
        // grid and any future child grid embedded in a detail modal —
        // neither needs a separate table_schema lookup.
        let TABLE_META_CACHE = {};
        // child table name -> Promise<bootstrap_data_table response>.
        // Populated once per session per child table, right after the
        // page-level grid's own schema reveals a type=sub_table row (see
        // prefetchSubTableChildren_) — same eager-prefetch-and-cache shape
        // as ENUM_OPTION_ALL_ROWS/loadEnumOptionRows_ below, so a detail
        // view's child sections render instantly from cache instead of
        // waiting on a fetch when the admin actually clicks a title link.
        let CHILD_TABLE_CACHE = {};
        // Every enum_option row (all types, active and inactive) — fetched
        // once per session, not on every popup open. null = not fetched yet.
        // Refreshed only after a successful Save in the manage popup below.
        let ENUM_OPTION_ALL_ROWS = null;
        // enum_type||value -> { isNew, data } — edits made in any enum-manage
        // popup, across any table/column, on any grid instance. Global, not
        // per-instance: flushed together with the *next* whole-table Save,
        // whichever grid that happens on, never sent independently by the
        // popup itself. Cleared alongside a grid's own dirty state wherever
        // "any unsaved changes?" is checked.
        let ENUM_OPTION_DIRTY = {};
        // Every currently-live DataGrid instance (the page-level grid, plus
        // — later — any child grids embedded in an open detail modal). Lets
        // applyEnumManagePopup below rebuild columns on every instance
        // actually displaying the changed enum_source, and lets the
        // sidebar-toggle listener redraw every instance, not just one
        // hardcoded grid.
        const LIVE_GRID_INSTANCES = new Set();

        setUnsavedGuard(() => hasUnsavedChanges());

        window.addEventListener("dash-sidebar-toggled", () => {
            LIVE_GRID_INSTANCES.forEach((inst) => {
                if (inst.tabulator) inst.tabulator.redraw(true);
            });
        });

        // /dashboard/tables/<table_name> — third path segment is the slug
        // (see vercel.json's dedicated rewrite for this one route). Not
        // present on a bare /dashboard/tables visit; that's fine, initial
        // load below falls back to the first configured table and then
        // fills the slug in via replaceState.
        function tableSlugFromUrl() {
            return window.location.pathname.split("/").filter(Boolean)[2] || "";
        }

        // /dashboard/tables/<table>/detail/<rowId> — one level of deep
        // link into a row's detail modal (see DataGrid#openDetailView).
        // Segments 3/4; "" if this URL isn't a detail deep link at all.
        function detailRowIdFromUrl() {
            const segments = window.location.pathname.split("/").filter(Boolean);
            return segments[3] === "detail" ? segments[4] || "" : "";
        }

        initDashboard("tables").then((ok) => {
            if (!ok) return;
            // Page's very first load: tab list + the active table's full
            // bootstrap in one call (was two sequential ones — see
            // bootstrap_tables_page on the backend). renderFromData is
            // called directly with the data already in hand — no second
            // fetch the way switching tabs later needs (see load()).
            apiCall("bootstrap_tables_page", { preferredTable: tableSlugFromUrl() }).then((res) => {
                document.getElementById("pageLoadSpinner").style.display = "none";
                if (!res.ok || !res.tables || !res.tables.length) {
                    document.getElementById("pageGridMount").textContent =
                        res.error || "No tables configured yet.";
                    return;
                }
                TABLES_LIST = res.tables;
                ACTIVE_TABLE = res.activeTable;
                const meta = TABLES_LIST.find((t) => t.table_name === ACTIVE_TABLE) || {};
                // Preserve a detail deep link's row-id suffix if the page
                // was loaded directly on one — this only needs to fill in
                // the table slug (e.g. a bare /dashboard/tables visit
                // defaulting to the first table), not strip it.
                const initialDetailId = detailRowIdFromUrl();
                history.replaceState(
                    null,
                    "",
                    "/dashboard/tables/" + ACTIVE_TABLE + (initialDetailId ? "/detail/" + initialDetailId : ""),
                );
                document.title = "Dashboard — " + (meta.label || ACTIVE_TABLE);
                document.getElementById("pageTitle").textContent = meta.label || ACTIVE_TABLE;
                document.getElementById("pageDesc").textContent = meta.description || "";

                buildTableTabs();
                PAGE_GRID = new DataGrid({
                    container: document.getElementById("pageGridMount"),
                    tableName: ACTIVE_TABLE,
                    onRendered: (grid) => prefetchSubTableChildren_(grid.schema),
                });
                PAGE_GRID.renderFromData(cacheBootstrapResponse(res, ACTIVE_TABLE));

                if (initialDetailId) {
                    // Row data is fully loaded already (bootstrap_data_table
                    // always fetches a whole table, no pagination) — just
                    // waiting on the Tabulator instance itself to finish
                    // building before a RowComponent lookup can work.
                    PAGE_GRID.tableReady.then(() => {
                        const rowComp = PAGE_GRID.findRowComponent(initialDetailId);
                        if (rowComp) PAGE_GRID.openDetailView(rowComp, { pushUrl: false });
                    });
                }
            }).catch(() => {
                document.getElementById("pageLoadSpinner").style.display = "none";
                document.getElementById("pageGridMount").textContent = "Failed to load.";
            });
        });

        function hasUnsavedChanges() {
            return (
                (PAGE_GRID && PAGE_GRID.hasUnsavedChanges()) ||
                (ACTIVE_DETAIL_MODAL && ACTIVE_DETAIL_MODAL.hasUnsavedChanges()) ||
                Object.keys(ENUM_OPTION_DIRTY).length > 0
            );
        }

        // Browser back/forward after switching tabs — same unsaved-changes
        // guard as a click, since it's the same underlying action.
        window.addEventListener("popstate", () => {
            const slug = tableSlugFromUrl();

            // Browser Back pressed while a detail modal was open, landing
            // back on this same table's plain URL — close the modal, not
            // a table switch. (A modal never spans a table switch: the
            // table-switch path below always force-closes it first, so
            // this table-changed-too case can't happen while
            // ACTIVE_DETAIL_MODAL is still set.)
            if (ACTIVE_DETAIL_MODAL && slug === ACTIVE_TABLE && !detailRowIdFromUrl()) {
                if (ACTIVE_DETAIL_MODAL.hasUnsavedChanges()) {
                    const modalUrl = ACTIVE_DETAIL_MODAL.url;
                    confirmModal("Discard unsaved changes and close?").then((yes) => {
                        if (yes) {
                            ACTIVE_DETAIL_MODAL.forceClose();
                        } else {
                            // Same "put the URL back" trick as a declined
                            // table switch below — the browser already
                            // popped it, this re-pushes it forward.
                            history.pushState(null, "", modalUrl);
                        }
                    });
                } else {
                    ACTIVE_DETAIL_MODAL.forceClose();
                }
                return;
            }

            if (!slug || slug === ACTIVE_TABLE || !TABLES_LIST.some((t) => t.table_name === slug)) {
                return;
            }
            if (hasUnsavedChanges()) {
                confirmModal("Discard unsaved changes and switch tables?").then((yes) => {
                    if (yes) {
                        activateTable(slug, false);
                    } else {
                        // The browser already changed the URL for us —
                        // put it back since the switch didn't happen.
                        history.pushState(null, "", "/dashboard/tables/" + ACTIVE_TABLE);
                    }
                });
            } else {
                activateTable(slug, false);
            }
        });

        // --- Table tabs (page-level orchestration, not part of DataGrid) -------

        function buildTableTabs() {
            const tabs = document.getElementById("tableTabs");
            tabs.style.display = TABLES_LIST.length > 1 ? "" : "none";
            tabs.innerHTML = "";
            TABLES_LIST.forEach((t) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className =
                    "table-tab" + (t.table_name === ACTIVE_TABLE ? " table-tab-active" : "");
                btn.textContent = t.label || t.table_name;
                btn.addEventListener("click", () => switchTable(t.table_name));
                tabs.appendChild(btn);
            });
        }

        function activateTable(tableName, pushUrl) {
            ACTIVE_TABLE = tableName;
            ENUM_OPTION_DIRTY = {};
            // No confirm here — hasUnsavedChanges() (checked by whichever
            // caller decided to switch tables at all) already covers an
            // open modal's dirty state, so if we got this far the admin
            // already agreed to discard it.
            if (ACTIVE_DETAIL_MODAL) ACTIVE_DETAIL_MODAL.forceClose();
            if (pushUrl) history.pushState(null, "", "/dashboard/tables/" + tableName);
            buildTableTabs();

            const meta = TABLES_LIST.find((t) => t.table_name === tableName) || {};
            document.title = "Dashboard — " + (meta.label || tableName);
            document.getElementById("pageTitle").textContent = meta.label || tableName;
            document.getElementById("pageDesc").textContent = meta.description || "";

            if (PAGE_GRID) PAGE_GRID.destroy();
            PAGE_GRID = new DataGrid({
                container: document.getElementById("pageGridMount"),
                tableName: tableName,
                onRendered: (grid) => prefetchSubTableChildren_(grid.schema),
            });
            PAGE_GRID.load();
        }

        function switchTable(tableName) {
            if (tableName === ACTIVE_TABLE) return;
            const proceed = () => activateTable(tableName, true);
            if (hasUnsavedChanges()) {
                confirmModal("Discard unsaved changes and switch tables?").then(
                    (yes) => yes && proceed(),
                );
            } else {
                proceed();
            }
        }

        /** Populates SCHEMA_CACHE/REF_CACHES/ENUM_CACHES from a response
         * shaped like bootstrapDataTable's (fields/references/enums) —
         * shared by a table's own first load and the page's very first
         * load (bootstrap_tables_page returns the same shape). tableName
         * is passed explicitly (not read from ACTIVE_TABLE) so this is
         * safe to run for any table, any grid instance, at any time — it
         * just pre-warms that table's cache for next time. */
        function cacheBootstrapResponse(res, tableName) {
            if (!res.ok) return res;
            SCHEMA_CACHE[tableName] = res.fields;
            TABLE_META_CACHE[tableName] = res.meta || {};
            Object.keys(res.references || {}).forEach((t) => {
                // Convention across this schema: every table's primary key
                // is "<table_name>_id".
                const idField = t + "_id";
                const byId = {};
                (res.references[t] || []).forEach((r) => {
                    byId[r[idField]] = r;
                });
                REF_CACHES[t] = byId;
            });
            Object.keys(res.enums || {}).forEach((e) => {
                ENUM_CACHES[e] = res.enums[e] || [];
            });
            return res;
        }

        /**
         * Kicks off a background fetch for every type=sub_table child
         * declared on a table's schema, deduped via CHILD_TABLE_CACHE —
         * called once, only for the page-level grid (see DataGrid's
         * onRendered hook), never from inside a child instance itself,
         * so embedding never triggers its own further prefetches. Not
         * gated on edit mode — the detail-view link this feeds lives in
         * view mode.
         */
        function prefetchSubTableChildren_(fields) {
            fields.filter((f) => f.type === "sub_table").forEach((f) => {
                const childTable = f.sub_table;
                if (CHILD_TABLE_CACHE[childTable]) return;
                CHILD_TABLE_CACHE[childTable] = apiCall("bootstrap_data_table", { table: childTable }).then(
                    (res) => {
                        if (!res.ok) {
                            delete CHILD_TABLE_CACHE[childTable];
                            return null;
                        }
                        cacheBootstrapResponse(res, childTable);
                        return res;
                    },
                );
            });
        }

        /** Per-type matching logic for one active column filter — see each
         * form builder in openColumnFilterPopup for the shape of `state`.
         * Stateless (only reads the shared REF_CACHES) — not a DataGrid
         * method, callable by any instance. */
        function columnFilterMatches(f, rawValue, state) {
            if (f.type === "integer" || f.type === "decimal" || f.type === "money") {
                const num = rawValue === "" || rawValue === null || rawValue === undefined ? null : Number(rawValue);
                if (num === null || isNaN(num)) return false;
                if (state.op === "between") return num >= Number(state.value) && num <= Number(state.value2);
                if (state.op === "gt") return num > Number(state.value);
                if (state.op === "lt") return num < Number(state.value);
                return num === Number(state.value); // "eq"
            }
            if (f.type === "date") {
                const val = String(rawValue || "");
                if (!val) return false;
                if (state.op === "between") return val >= state.value && val <= state.value2;
                if (state.op === "before") return val < state.value;
                if (state.op === "after") return val > state.value;
                return val === state.value; // "on"
            }
            if (f.type === "boolean") {
                return rawValue === (state.value === "true");
            }
            if (f.type === "enum") {
                return state.values.includes(rawValue);
            }
            if (f.type === "enum_list") {
                const rowValues = String(rawValue || "").split(",").map((v) => v.trim());
                return state.values.some((v) => rowValues.includes(v));
            }
            // A reference column with few enough distinct rows gets the
            // same checkbox-multi-select treatment as enum (see
            // openColumnFilterPopup/buildReferenceFilterForm) — matched
            // against the raw id directly, same as enum, not the resolved
            // label used by the text-filter path below.
            if (f.type === "reference" && state.values) {
                return state.values.includes(String(rawValue));
            }
            // text / reference (large table, still text-filtered) / default
            // — resolve to the same label the grid and free-text search
            // already display, not the raw value.
            let label = rawValue;
            if (f.type === "reference") {
                const cache = REF_CACHES[f.ref_table] || {};
                const row = cache[rawValue];
                label = row ? row[f.ref_label_field] : rawValue;
            }
            const hay = String(label ?? "").toLowerCase();
            const needle = String(state.value ?? "").toLowerCase();
            if (state.op === "equals") return hay === needle;
            if (state.op === "starts") return hay.startsWith(needle);
            if (state.op === "ends") return hay.endsWith(needle);
            return hay.includes(needle); // "contains"
        }

        const COLUMN_FILTER_ICON_SVG =
            '<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1.5 2h13l-5 6.2v5.3l-3 1.5V8.2z"/></svg>';
        const COLUMN_MANAGE_ICON_SVG =
            '<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.3v2M8 12.7v2M1.3 8h2M12.7 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"/></svg>';

        /**
         * Shared plumbing for both the column-filter popup and the
         * enum-option-manage popup below: position near anchorEl, close on
         * outside click or Escape. Returns a close() function the caller
         * can also invoke directly (e.g. after a successful action) — that
         * one always closes immediately, bypassing canCloseFn, since it's
         * meant for "the action already completed" moments (Apply/Clear/
         * Save), not for the user backing out.
         *
         * canCloseFn (optional): checked only for outside-click/Escape: if
         * it returns false, confirms before discarding instead of closing
         * immediately — same unsaved-changes guard the main grid uses.
         *
         * onClose (optional): fires whenever the popup actually closes, no
         * matter which path (a button, outside click, or Escape) — lets a
         * caller that must always resolve one way or another (e.g. a
         * Tabulator cell editor, which needs success()/cancel() called
         * exactly once no matter how the user dismisses it) hook every
         * closing path instead of only the ones with an explicit handler.
         */
        function makeFloatingPopup(popup, anchorEl, canCloseFn, onClose) {
            document.body.appendChild(popup);
            const rect = anchorEl.getBoundingClientRect();
            const popupRect = popup.getBoundingClientRect();
            const maxLeft = window.scrollX + document.documentElement.clientWidth - popupRect.width - 8;
            popup.style.left = Math.max(8, Math.min(rect.left + window.scrollX, maxLeft)) + "px";
            popup.style.top = rect.bottom + window.scrollY + 4 + "px";

            function close() {
                popup.remove();
                document.removeEventListener("mousedown", onOutside, true);
                document.removeEventListener("keydown", onKey, true);
                if (onClose) onClose();
            }
            function attemptClose() {
                if (canCloseFn && !canCloseFn()) {
                    confirmModal("Discard unsaved changes?").then((yes) => yes && close());
                    return;
                }
                close();
            }
            function onOutside(e) {
                if (!popup.contains(e.target) && e.target !== anchorEl) attemptClose();
            }
            function onKey(e) {
                if (e.key === "Escape") attemptClose();
            }
            // Deferred so the same click that opened this popup doesn't
            // immediately close it via the outside-click listener.
            setTimeout(() => {
                document.addEventListener("mousedown", onOutside, true);
                document.addEventListener("keydown", onKey, true);
            }, 0);
            return close;
        }

        function buildTextFilterForm(popup, state) {
            const opSelect = document.createElement("select");
            [
                ["contains", "Contains"],
                ["equals", "Equals"],
                ["starts", "Starts with"],
                ["ends", "Ends with"],
            ].forEach(([v, label]) => {
                const o = document.createElement("option");
                o.value = v;
                o.textContent = label;
                opSelect.appendChild(o);
            });
            opSelect.value = (state && state.op) || "contains";
            const input = document.createElement("input");
            input.type = "text";
            input.placeholder = "Value…";
            input.value = (state && state.value) || "";
            popup.append(opSelect, input);
            setTimeout(() => input.focus(), 0);
            return () => (input.value ? { op: opSelect.value, value: input.value } : null);
        }

        function buildNumberFilterForm(popup, state) {
            const opSelect = document.createElement("select");
            [
                ["eq", "Equals"],
                ["gt", "Greater than"],
                ["lt", "Less than"],
                ["between", "Between"],
            ].forEach(([v, label]) => {
                const o = document.createElement("option");
                o.value = v;
                o.textContent = label;
                opSelect.appendChild(o);
            });
            opSelect.value = (state && state.op) || "eq";
            const input1 = document.createElement("input");
            input1.type = "number";
            input1.placeholder = "Value…";
            input1.value = state && state.value !== undefined ? state.value : "";
            const input2 = document.createElement("input");
            input2.type = "number";
            input2.placeholder = "and…";
            input2.value = state && state.value2 !== undefined ? state.value2 : "";
            input2.style.display = opSelect.value === "between" ? "" : "none";
            opSelect.addEventListener("change", () => {
                input2.style.display = opSelect.value === "between" ? "" : "none";
            });
            popup.append(opSelect, input1, input2);
            setTimeout(() => input1.focus(), 0);
            return () => {
                if (input1.value === "") return null;
                if (opSelect.value === "between" && input2.value === "") return null;
                return { op: opSelect.value, value: input1.value, value2: input2.value };
            };
        }

        function buildDateFilterForm(popup, state) {
            const opSelect = document.createElement("select");
            [
                ["on", "On"],
                ["before", "Before"],
                ["after", "After"],
                ["between", "Between"],
            ].forEach(([v, label]) => {
                const o = document.createElement("option");
                o.value = v;
                o.textContent = label;
                opSelect.appendChild(o);
            });
            opSelect.value = (state && state.op) || "on";
            const input1 = document.createElement("input");
            input1.type = "date";
            input1.value = (state && state.value) || "";
            const input2 = document.createElement("input");
            input2.type = "date";
            input2.value = (state && state.value2) || "";
            input2.style.display = opSelect.value === "between" ? "" : "none";
            opSelect.addEventListener("change", () => {
                input2.style.display = opSelect.value === "between" ? "" : "none";
            });
            popup.append(opSelect, input1, input2);
            return () => {
                if (!input1.value) return null;
                if (opSelect.value === "between" && !input2.value) return null;
                return { op: opSelect.value, value: input1.value, value2: input2.value };
            };
        }

        function buildBooleanFilterForm(popup, state) {
            const wrap = document.createElement("div");
            wrap.className = "col-filter-radios";
            const current = state ? state.value : "any";
            [
                ["any", "Any"],
                ["true", "True"],
                ["false", "False"],
            ].forEach(([v, label]) => {
                const lab = document.createElement("label");
                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "col-filter-bool";
                radio.value = v;
                radio.checked = current === v;
                lab.append(radio, document.createTextNode(" " + label));
                wrap.appendChild(lab);
            });
            popup.appendChild(wrap);
            return () => {
                const checked = wrap.querySelector("input:checked");
                const v = checked ? checked.value : "any";
                return v === "any" ? null : { value: v };
            };
        }

        function buildEnumFilterForm(popup, f, state) {
            const options = ENUM_CACHES[f.enum_source] || [];
            const checkedValues = new Set((state && state.values) || []);
            const wrap = document.createElement("div");
            wrap.className = "col-filter-checklist";
            options.forEach((o) => {
                const lab = document.createElement("label");
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = o.value;
                cb.checked = checkedValues.has(o.value);
                lab.append(cb, document.createTextNode(" " + o.label));
                wrap.appendChild(lab);
            });
            popup.appendChild(wrap);
            return () => {
                const values = Array.from(wrap.querySelectorAll("input:checked")).map((cb) => cb.value);
                return values.length ? { values: values } : null;
            };
        }

        // A reference column only gets the checkbox-multi-select filter
        // (see openColumnFilterPopup) when its referenced table has at
        // most this many rows — small lookup tables like kiosk (4 rows)
        // browse fine as a checklist, large ones like product/stock_item
        // (70+) stay on the plain text filter, same as before this existed.
        const REFERENCE_CHECKLIST_MAX_OPTIONS = 20;

        function referenceOptionCount_(f) {
            return Object.keys(REF_CACHES[f.ref_table] || {}).length;
        }

        function buildReferenceFilterForm(popup, f, state) {
            const cache = REF_CACHES[f.ref_table] || {};
            const options = Object.keys(cache)
                .map((id) => ({ value: id, label: cache[id][f.ref_label_field] || id }))
                .sort((a, b) => String(a.label).localeCompare(String(b.label)));
            const checkedValues = new Set((state && state.values) || []);
            const wrap = document.createElement("div");
            wrap.className = "col-filter-checklist";
            options.forEach((o) => {
                const lab = document.createElement("label");
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = o.value;
                cb.checked = checkedValues.has(o.value);
                lab.append(cb, document.createTextNode(" " + o.label));
                wrap.appendChild(lab);
            });
            popup.appendChild(wrap);
            return () => {
                const values = Array.from(wrap.querySelectorAll("input:checked")).map((cb) => cb.value);
                return values.length ? { values: values } : null;
            };
        }

        // --- Enum-option manage popup (global — not tied to any one grid
        // instance's column, any grid can host the gear icon that opens
        // this) ---------------------------------------------------------

        /** Fetches every enum_option row (every type, active and inactive)
         * once per session — not on every popup open — and caches it in
         * ENUM_OPTION_ALL_ROWS. Updated optimistically by
         * applyEnumManagePopup after that (never re-fetched from the
         * server within a session), same "session-lifetime cache" pattern
         * as SCHEMA_CACHE/REF_CACHES/ENUM_CACHES. */
        function loadEnumOptionRows_() {
            if (ENUM_OPTION_ALL_ROWS) return Promise.resolve(ENUM_OPTION_ALL_ROWS);
            return apiCall("list_table_rows", { table: "enum_option" }).then((res) => {
                if (res.ok) ENUM_OPTION_ALL_ROWS = res.rows;
                return res.ok ? ENUM_OPTION_ALL_ROWS : null;
            });
        }

        function enumOptionKey_(r) {
            return r.enum_type + "||" + r.value;
        }

        /**
         * Optimistic, same model as the main grid: opens instantly from
         * cache (prefetched by DataGrid#attachColumnManageIcons, so usually
         * already resolved by the time this runs), every toggle/reorder/add
         * edits a local working copy with an immediate re-render — nothing
         * reaches the server here at all, not even on the popup's own Apply
         * (see applyEnumManagePopup — it queues into the shared
         * ENUM_OPTION_DIRTY, actually sent only by the next whole-table
         * Save). Closing without applying (Cancel, outside click, Escape)
         * is a plain, unconditional discard of this popup's local copy —
         * no confirmation of any kind, on any close path, on purpose:
         * nothing's committed anywhere yet at that point, there's nothing
         * at risk to warn about.
         */
        function openEnumManagePopup(f, anchorEl) {
            document.querySelectorAll(".col-filter-popup, .enum-manage-popup").forEach((el) => el.remove());
            const popup = document.createElement("div");
            popup.className = "enum-manage-popup";
            popup.innerHTML = '<p class="enum-manage-status">Loading…</p>';
            const dirty = {};
            const close = makeFloatingPopup(popup, anchorEl);
            loadEnumOptionRows_().then((allRows) => {
                if (!allRows) {
                    popup.innerHTML = '<p class="enum-manage-status">Could not load options.</p>';
                    return;
                }
                const filtered = allRows
                    .filter((r) => r.enum_type === f.enum_source)
                    .sort((a, b) => Number(a.sort_order) - Number(b.sort_order));
                // Two separate deep copies — workingRows gets mutated by
                // toggle/reorder/add, originalRows never does, so reverting
                // a value back to it can actually be detected (same reason
                // DataGrid keeps originalRows separate from what Tabulator
                // mutates).
                const originalRows = JSON.parse(JSON.stringify(filtered));
                const workingRows = JSON.parse(JSON.stringify(filtered));
                renderEnumManagePopup(popup, f, close, workingRows, dirty, originalRows);
            });
        }

        function renderEnumManagePopup(popup, f, close, workingRows, dirty, originalRows) {
            popup.innerHTML = "";
            const title = document.createElement("div");
            title.className = "enum-manage-title";
            title.textContent = "Manage: " + (f.label || f.column_name);
            popup.appendChild(title);

            const rerender = () =>
                renderEnumManagePopup(popup, f, close, workingRows, dirty, originalRows);

            const list = document.createElement("div");
            list.className = "enum-manage-list";
            workingRows.forEach((opt, i) => {
                list.appendChild(
                    buildEnumOptionRow(opt, i, workingRows, dirty, originalRows, rerender),
                );
            });
            popup.appendChild(list);
            popup.appendChild(buildEnumAddForm(f, workingRows, dirty, rerender));

            const actions = document.createElement("div");
            actions.className = "enum-manage-actions";
            const dirtyCount = Object.keys(dirty).length;
            const cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "col-filter-clear";
            cancelBtn.textContent = "Cancel";
            cancelBtn.title = "Close without applying";
            // Deliberately no confirm — nothing here is committed to
            // ENUM_OPTION_DIRTY/the shared caches until Apply, so there's
            // genuinely nothing at risk to warn about.
            cancelBtn.addEventListener("click", close);
            const applyBtn = document.createElement("button");
            applyBtn.type = "button";
            applyBtn.className = "dash-btn";
            applyBtn.disabled = dirtyCount === 0;
            applyBtn.textContent = dirtyCount ? "Apply (" + dirtyCount + ")" : "Apply";
            applyBtn.title = dirtyCount
                ? "Queue " + dirtyCount + " change(s) — not sent to the server until you Save the table"
                : "No changes to apply";
            applyBtn.addEventListener("click", () => applyEnumManagePopup(f, close, workingRows, dirty));
            actions.append(cancelBtn, applyBtn);
            popup.appendChild(actions);
        }

        function findOriginalEnumOption_(originalRows, key) {
            return originalRows.find((r) => enumOptionKey_(r) === key);
        }

        function enumOptionRowsEqual_(a, b) {
            const keys = new Set(Object.keys(a).concat(Object.keys(b)));
            for (const k of keys) {
                if (String(a[k] ?? "") !== String(b[k] ?? "")) return false;
            }
            return true;
        }

        // Same revert-detection DataGrid#markRowDirty does — every
        // toggle/reorder marked dirty unconditionally before, so reverting
        // a value back to what it started as never cleared the counter.
        function markEnumOptionDirty_(dirty, row, originalRows) {
            const key = enumOptionKey_(row);
            const wasNew = !!(dirty[key] && dirty[key].isNew);
            if (!wasNew) {
                const original = findOriginalEnumOption_(originalRows, key);
                if (original && enumOptionRowsEqual_(row, original)) {
                    delete dirty[key];
                    return;
                }
            }
            dirty[key] = { isNew: wasNew, data: row };
        }

        function buildEnumOptionRow(opt, index, workingRows, dirty, originalRows, rerender) {
            const row = document.createElement("div");
            row.className = "enum-manage-row" + (opt.active !== true ? " is-inactive" : "");

            const reorder = (toIndex) => {
                const other = workingRows[toIndex];
                const tmp = opt.sort_order;
                opt.sort_order = other.sort_order;
                other.sort_order = tmp;
                workingRows.sort((a, b) => Number(a.sort_order) - Number(b.sort_order));
                markEnumOptionDirty_(dirty, opt, originalRows);
                markEnumOptionDirty_(dirty, other, originalRows);
                rerender();
            };
            const upBtn = document.createElement("button");
            upBtn.type = "button";
            upBtn.className = "enum-manage-arrow";
            upBtn.textContent = "▲";
            upBtn.disabled = index === 0;
            upBtn.addEventListener("click", () => reorder(index - 1));
            const downBtn = document.createElement("button");
            downBtn.type = "button";
            downBtn.className = "enum-manage-arrow";
            downBtn.textContent = "▼";
            downBtn.disabled = index === workingRows.length - 1;
            downBtn.addEventListener("click", () => reorder(index + 1));

            const label = document.createElement("span");
            label.className = "enum-manage-label";
            label.textContent = opt.label + " (" + opt.value + ")";

            const toggle = document.createElement("span");
            toggle.className = "bool-switch" + (opt.active === true ? " is-on" : "");
            toggle.title = opt.active === true ? "Deactivate" : "Activate";
            toggle.addEventListener("click", () => {
                opt.active = opt.active !== true;
                markEnumOptionDirty_(dirty, opt, originalRows);
                rerender();
            });

            row.append(upBtn, downBtn, label, toggle);
            return row;
        }

        function buildEnumAddForm(f, workingRows, dirty, rerender) {
            const form = document.createElement("div");
            form.className = "enum-manage-add";
            const valueInput = document.createElement("input");
            valueInput.type = "text";
            valueInput.placeholder = "Value";
            const labelInput = document.createElement("input");
            labelInput.type = "text";
            labelInput.placeholder = "Label";
            const addBtn = document.createElement("button");
            addBtn.type = "button";
            addBtn.className = "dash-btn";
            addBtn.textContent = "Add";
            addBtn.title = "Add a new option (not saved until you click Save)";
            addBtn.addEventListener("click", () => {
                if (!valueInput.value.trim() || !labelInput.value.trim()) return;
                const maxOrder = workingRows.reduce((m, o) => Math.max(m, Number(o.sort_order) || 0), 0);
                const newRow = {
                    // No synthetic id — enum_type+value is the real
                    // primary key now (see database_schema.md), and both
                    // are already here.
                    enum_type: f.enum_source,
                    value: valueInput.value.trim(),
                    label: labelInput.value.trim(),
                    sort_order: maxOrder + 1,
                    active: true,
                };
                workingRows.push(newRow);
                dirty[enumOptionKey_(newRow)] = { isNew: true, data: newRow };
                rerender();
            });
            form.append(valueInput, labelInput, addBtn);
            return form;
        }

        /**
         * Purely local — never touches the backend. Merges this popup
         * session's dirty entries into the shared ENUM_OPTION_DIRTY queue
         * (actually sent only by the next whole-table Save, from whichever
         * grid instance that ends up being clicked on), and merges
         * workingRows into ENUM_OPTION_ALL_ROWS + rebuilds ENUM_CACHES.
         * Every live grid instance currently displaying this enum_source's
         * column gets its columns rebuilt right away so cell
         * formatters/editors reflect the change immediately — same
         * optimistic principle as every other edit in this file, just not
         * persisted yet.
         */
        function applyEnumManagePopup(f, close, workingRows, dirty) {
            Object.assign(ENUM_OPTION_DIRTY, dirty);
            ENUM_OPTION_ALL_ROWS = (ENUM_OPTION_ALL_ROWS || [])
                .filter((r) => r.enum_type !== f.enum_source)
                .concat(workingRows);
            ENUM_CACHES[f.enum_source] = workingRows
                .filter((o) => o.active === true)
                .slice()
                .sort((a, b) => Number(a.sort_order) - Number(b.sort_order))
                .map((o) => ({ value: o.value, label: o.label }));
            LIVE_GRID_INSTANCES.forEach((inst) => {
                if (inst.schema.some((sf) => sf.enum_source === f.enum_source)) {
                    inst.rebuildColumns();
                }
            });
            close();
        }

        // --- Grid-wide shared helpers (stateless — no DataGrid instance
        // coupling, callable by any instance) -----------------------------

        /** Comma-separated stored values -> comma-separated labels for
         * display — an enum_list column's cell is always a plain string,
         * never an array, on the way in or out. */
        function enumListLabel(raw, options) {
            const values = String(raw || "")
                .split(",")
                .map((v) => v.trim())
                .filter(Boolean);
            if (!values.length) return "";
            return values
                .map((v) => {
                    const opt = options.find((o) => o.value === v);
                    return opt ? opt.label : v;
                })
                .join(", ");
        }

        /** Plain-text display value for one field — the single source of
         * truth for "how does this value read to a human," shared by
         * buildColumns' cell formatters and the detail-view's read-only
         * field display (see DataGrid#openDetailView), so the two never
         * drift apart. Not used for the boolean column's interactive
         * switch (that's a control, not a text value) — callers wanting a
         * plain Yes/No string for a boolean still get one here. */
        function formatCellValue(f, value) {
            if (f.type === "reference") {
                const cache = REF_CACHES[f.ref_table] || {};
                const row = cache[value];
                return row ? row[f.ref_label_field] : value;
            }
            if (f.type === "enum") {
                const options = ENUM_CACHES[f.enum_source] || [];
                const opt = options.find((o) => o.value === value);
                return opt ? opt.label : value;
            }
            if (f.type === "enum_list") {
                return enumListLabel(value, ENUM_CACHES[f.enum_source] || []);
            }
            if (f.type === "money") {
                return value === "" || value === null || value === undefined ? "" : "€" + Number(value).toFixed(2);
            }
            if (f.type === "boolean") {
                return value === true ? "Yes" : "No";
            }
            return value === null || value === undefined ? "" : String(value);
        }

        /**
         * Builds a bare input control (no label — every caller renders its
         * own, layouts differ) for one field's current value, calling
         * onChange with the new value on every change. Shared by the
         * detail-view parent-fields editor and the Add-row modal, so every
         * type's editing UI — including the reference picker, previously
         * missing from Add-row's non-key value fields entirely — only
         * exists in one place.
         */
        function buildFieldInput(f, currentValue, onChange) {
            if (f.type === "reference") {
                const wrap = document.createElement("div");
                const cache = REF_CACHES[f.ref_table] || {};
                const picker = makeSearchPick(wrap, {
                    placeholder: "Search " + (f.label || f.column_name).toLowerCase() + "…",
                    getItems: (q) =>
                        Object.keys(cache)
                            .map((id) => ({ id: id, label: cache[id][f.ref_label_field] }))
                            .filter((it) => !q || it.label.toLowerCase().includes(q))
                            .sort((a, b) => a.label.localeCompare(b.label)),
                    onSelect: (item) => onChange(item.id),
                });
                if (currentValue && cache[currentValue]) picker.setLabel(cache[currentValue][f.ref_label_field]);
                return wrap;
            }
            if (f.type === "enum") {
                const options = ENUM_CACHES[f.enum_source] || [];
                const select = document.createElement("select");
                select.innerHTML =
                    '<option value="">Select…</option>' +
                    options
                        .map(
                            (o) =>
                                '<option value="' +
                                o.value +
                                '"' +
                                (o.value === currentValue ? " selected" : "") +
                                ">" +
                                o.label +
                                "</option>",
                        )
                        .join("");
                select.addEventListener("change", () => onChange(select.value || undefined));
                return select;
            }
            if (f.type === "enum_list") {
                const options = ENUM_CACHES[f.enum_source] || [];
                const current = String(currentValue || "")
                    .split(",")
                    .map((v) => v.trim())
                    .filter(Boolean);
                const select = document.createElement("select");
                select.multiple = true;
                select.style.minHeight = "6rem";
                options.forEach((o) => {
                    const opt = document.createElement("option");
                    opt.value = o.value;
                    opt.textContent = o.label;
                    opt.selected = current.includes(o.value);
                    select.appendChild(opt);
                });
                select.addEventListener("change", () => {
                    onChange(Array.from(select.selectedOptions).map((o) => o.value).join(","));
                });
                return select;
            }
            if (f.type === "boolean") {
                const input = document.createElement("input");
                input.type = "checkbox";
                input.style.width = "auto";
                input.checked = currentValue === true;
                input.addEventListener("change", () => onChange(input.checked));
                return input;
            }
            const inputType =
                f.type === "integer" || f.type === "decimal" || f.type === "money"
                    ? "number"
                    : f.type === "date"
                      ? "date"
                      : "text";
            const input = document.createElement("input");
            input.type = inputType;
            input.value = currentValue ?? "";
            input.addEventListener("input", () => onChange(input.value));
            return input;
        }

        // Loose (string-coerced) comparison — the same value arriving as
        // different JS types (e.g. a freshly-toggled boolean vs. whatever
        // shape the sheet round-tripped it as) must still count as
        // unchanged, not a false "still dirty".
        function rowsEqual(a, b) {
            const keys = new Set(Object.keys(a).concat(Object.keys(b)));
            for (const k of keys) {
                if (String(a[k] ?? "") !== String(b[k] ?? "")) return false;
            }
            return true;
        }

        /**
         * Renders as a floating checkbox-list popup (same pattern as the
         * column-filter/enum-manage popups), not an inline <select
         * multiple> — Tabulator doesn't grow a row's height to fit a
         * custom editor, and .tabulator's own overflow:hidden (for the
         * rounded-corner look) clips anything taller than the row, which
         * made a real multi-select look like a single-line text box. The
         * returned element is just a placeholder Tabulator inserts into
         * the cell; the actual UI lives in document.body via
         * makeFloatingPopup, same as everything else that needs to escape
         * that clipping.
         */
        function enumListEditor(cell, onRendered, success, cancel, editorParams) {
            const options = editorParams.options || [];
            const current = String(cell.getValue() || "")
                .split(",")
                .map((v) => v.trim())
                .filter(Boolean);

            const placeholder = document.createElement("div");
            placeholder.className = "enumlist-editor-placeholder";
            placeholder.textContent = enumListLabel(cell.getValue(), options) || "—";

            const popup = document.createElement("div");
            popup.className = "col-filter-popup";
            const list = document.createElement("div");
            list.className = "col-filter-checklist";
            options.forEach((o) => {
                const lab = document.createElement("label");
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = o.value;
                cb.checked = current.includes(o.value);
                lab.append(cb, document.createTextNode(" " + o.label));
                list.appendChild(lab);
            });
            popup.appendChild(list);

            const actions = document.createElement("div");
            actions.className = "col-filter-actions";
            const cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "col-filter-clear";
            cancelBtn.textContent = "Cancel";
            const doneBtn = document.createElement("button");
            doneBtn.type = "button";
            doneBtn.className = "dash-btn col-filter-apply";
            doneBtn.textContent = "Done";
            actions.append(cancelBtn, doneBtn);
            popup.appendChild(actions);

            onRendered(() => {
                let resolved = false;
                // canCloseFn omitted (always OK to close immediately) —
                // onClose is what matters here: whichever path closes this
                // (Cancel, Done, outside click, Escape) must resolve the
                // editor exactly once, so it can't get stuck "editing".
                const close = makeFloatingPopup(popup, placeholder, null, () => {
                    if (!resolved) {
                        resolved = true;
                        cancel();
                    }
                });
                cancelBtn.addEventListener("click", close);
                doneBtn.addEventListener("click", () => {
                    resolved = true;
                    success(Array.from(list.querySelectorAll("input:checked")).map((cb) => cb.value).join(","));
                    close();
                });
            });

            return placeholder;
        }

        function fieldValidator(f) {
            return (cell, value) => {
                if (f.required === true && (value === "" || value === null || value === undefined)) {
                    return false;
                }
                if (
                    (f.type === "integer" || f.type === "decimal" || f.type === "money") &&
                    value !== "" &&
                    value !== null &&
                    value !== undefined
                ) {
                    const num = Number(value);
                    if (isNaN(num)) return false;
                    if (f.type === "integer" && !Number.isInteger(num)) return false;
                    if (f.min !== "" && f.min !== null && f.min !== undefined && num < Number(f.min))
                        return false;
                    if (f.max !== "" && f.max !== null && f.max !== undefined && num > Number(f.max))
                        return false;
                }
                return true;
            };
        }

        /**
         * The detail modal's parent-fields section — a single row's own
         * fields, view + edit + independent save. Not a DataGrid instance:
         * one row's own fields don't need a Tabulator grid, just a small
         * form, so this is a lighter, bespoke component instead of
         * reusing the heavier multi-row class. Reuses formatCellValue/
         * buildFieldInput though, so the two never present a field
         * differently.
         *
         * opts: { tableName, schema, keyFields, rowData, onSaved(updatedRow) }
         * Returns { hasUnsavedChanges() } — checked by the modal's own
         * close guard.
         */
        function buildParentFieldsEditor(container, opts) {
            let editing = false;
            let saving = false;
            let dirty = false;
            let workingRow = Object.assign({}, opts.rowData);
            let saveBtn, errorEl;

            function updateSaveButton() {
                saveBtn.disabled = !dirty || saving;
            }

            function doSave() {
                saving = true;
                errorEl.textContent = "";
                updateSaveButton();
                apiCall("save_table_row", { table: opts.tableName, isNew: false, row: workingRow }).then((res) => {
                    saving = false;
                    if (!res.ok) {
                        errorEl.textContent = res.error || "Could not save.";
                        updateSaveButton();
                        return;
                    }
                    opts.rowData = Object.assign({}, workingRow);
                    dirty = false;
                    editing = false;
                    opts.onSaved(opts.rowData);
                    render();
                });
            }

            function render() {
                container.innerHTML = "";

                const header = document.createElement("div");
                header.className = "detail-parent-header";

                const editBtn = document.createElement("button");
                editBtn.className = "dash-btn";
                editBtn.style.background = "var(--line)";
                editBtn.style.color = "var(--ink)";
                editBtn.textContent = "Edit";
                editBtn.style.display = editing ? "none" : "";
                editBtn.addEventListener("click", () => {
                    editing = true;
                    render();
                });
                header.appendChild(editBtn);

                const cancelBtn = document.createElement("button");
                cancelBtn.className = "dash-btn";
                cancelBtn.style.background = "var(--line)";
                cancelBtn.style.color = "var(--ink)";
                cancelBtn.textContent = "Cancel";
                cancelBtn.style.display = editing ? "" : "none";
                cancelBtn.addEventListener("click", () => {
                    const proceed = () => {
                        workingRow = Object.assign({}, opts.rowData);
                        dirty = false;
                        editing = false;
                        render();
                    };
                    if (dirty) {
                        confirmModal("Discard unsaved changes?").then((yes) => yes && proceed());
                    } else {
                        proceed();
                    }
                });
                header.appendChild(cancelBtn);

                saveBtn = document.createElement("button");
                saveBtn.className = "dash-btn";
                saveBtn.textContent = "Save";
                saveBtn.style.display = editing ? "" : "none";
                saveBtn.disabled = !dirty || saving;
                saveBtn.addEventListener("click", doSave);
                header.appendChild(saveBtn);

                container.appendChild(header);

                // Wrapping flex row, not one long column — a table with a
                // dozen short fields (name, email, a couple flags) reads
                // far better across two or three columns than stacked.
                const fieldsWrap = document.createElement("div");
                fieldsWrap.className = "detail-fields-grid";
                container.appendChild(fieldsWrap);

                opts.schema
                    .filter((f) => f.hidden !== true && f.type !== "sub_table")
                    .forEach((f) => {
                        const isKey = opts.keyFields.includes(f);
                        const canEdit = editing && !isKey && f.editable_on_update === true;
                        const value = workingRow[f.column_name];

                        if (canEdit) {
                            const wrap = document.createElement("div");
                            wrap.className = "modal-field";
                            const label = document.createElement("label");
                            label.textContent = f.label || f.column_name;
                            wrap.appendChild(label);
                            wrap.appendChild(
                                buildFieldInput(f, value, (newVal) => {
                                    workingRow[f.column_name] = newVal;
                                    dirty = !rowsEqual(workingRow, opts.rowData);
                                    updateSaveButton();
                                }),
                            );
                            fieldsWrap.appendChild(wrap);
                            return;
                        }

                        // Blank fields (e.g. a supplier with no
                        // contact_email set) just clutter the view with
                        // empty rows — skip them entirely rather than
                        // showing a label over nothing. Only applies to
                        // the read-only display; a field currently being
                        // edited always shows (see canEdit branch above).
                        const display = formatCellValue(f, value);
                        if (display === "" || display === null || display === undefined) return;
                        const wrap = document.createElement("div");
                        wrap.className = "modal-field";
                        wrap.innerHTML = "<label>" + (f.label || f.column_name) + "</label><div>" + display + "</div>";
                        fieldsWrap.appendChild(wrap);
                    });

                errorEl = document.createElement("div");
                errorEl.className = "modal-error";
                container.appendChild(errorEl);
            }

            render();

            return {
                hasUnsavedChanges: () => dirty,
            };
        }

        // --- DataGrid: one independent grid instance --------------------------
        //
        // One instance owns one Tabulator grid, its own toolbar, and all of
        // its own edit/filter/save state — genuinely independent of any
        // other instance on the page. The page-level tab (PAGE_GRID) is one
        // instance; a future detail-view modal instantiates more, one per
        // embedded child table, each with its own container.

        class DataGrid {
            /**
             * @param {Object} opts
             * @param {HTMLElement} opts.container - element this instance
             *   owns exclusively; builds its own toolbar/spinner/grid
             *   sub-elements into it.
             * @param {string} opts.tableName
             * @param {Object} [opts.parentScope] - {column, value}. Only
             *   ever set for a grid embedded under a specific parent row
             *   (a detail-view child section): auto-fills + hides `column`
             *   on Add, restricts displayed rows to `value`, and hides
             *   that column in the grid itself. Not a generalization of
             *   any other filter mechanism — a fresh, standalone
             *   mechanism built for this purpose.
             * @param {Function} [opts.onRendered] - called with (this)
             *   after every successful renderFromData. Only ever wired up
             *   for the page-level grid (see activateTable/initial
             *   bootstrap), to kick off prefetchSubTableChildren_ — a
             *   child instance never receives one, so embedding a child
             *   grid can't accidentally trigger its own further prefetch.
             *
             * this.meta (this table's own table_schema row — label,
             * description, hard_delete, has_detail_view, type) is not a
             * constructor param: it's populated by renderFromData from
             * whatever response it's given (res.meta), which every
             * bootstrap_data_table call includes for its own table — works
             * identically for the page-level grid and any child grid.
             */
            constructor({ container, tableName, parentScope, onRendered }) {
                this.container = container;
                this.tableName = tableName;
                this.meta = {};
                this.parentScope = parentScope || null;
                this.onRendered = onRendered || null;

                this.schema = [];
                this.keyFields = [];
                this.tabulator = null;
                this.tableReady = Promise.resolve();
                this.searchText = "";
                // column_name -> filter state, shape depends on the
                // column's type (see columnFilterMatches) — set/cleared
                // via each column's filter icon popup, independent of
                // Tabulator's own column definitions so it survives every
                // setColumns() rebuild (Edit/Cancel/Save) instead of
                // resetting on each one.
                this.columnFilters = {};
                this.editMode = false;
                // Snapshot of what the server last returned — Cancel
                // restores from this locally (no round trip); Save updates
                // it on success so a later Cancel never wipes out
                // already-saved work.
                this.originalRows = [];
                // rowKeyStr -> { isNew, data } — only what's actually
                // changed since the last save gets sent back, never the
                // whole table.
                this.dirty = {};
                // Set once destroy() runs (e.g. a tab switch replaces the
                // page-level instance, or a detail modal closes) — guards
                // against an in-flight fetch's response trying to touch a
                // torn-down instance's DOM.
                this.destroyed = false;

                this._buildScaffold();
                LIVE_GRID_INSTANCES.add(this);
            }

            _buildScaffold() {
                this.toolbarEl = document.createElement("div");
                this.toolbarEl.className = "dash-toolbar";
                this.toolbarEl.style.display = "none";
                this.spinnerEl = document.createElement("div");
                this.spinnerEl.className = "dash-spinner";
                this.gridEl = document.createElement("div");
                this.gridEl.className = "dash-grid-area";
                this.gridEl.style.display = "none";
                this.container.append(this.toolbarEl, this.spinnerEl, this.gridEl);
            }

            destroy() {
                this.destroyed = true;
                LIVE_GRID_INSTANCES.delete(this);
                if (this.tabulator) {
                    this.tabulator.destroy();
                    this.tabulator = null;
                }
                this.container.innerHTML = "";
            }

            hasUnsavedChanges() {
                return Object.keys(this.dirty).length > 0;
            }

            rowKeyStr(row) {
                // Every primary key is client-known immediately: a picked
                // foreign key (reference-type), or a UUID generated right
                // here at Add time (see openAddModal) — never
                // server-generated, so a row's real key never changes
                // after it's created and this is always safe to use.
                return this.keyFields.map((f) => row[f.column_name]).join("||");
            }

            findOriginalRow(key) {
                return this.originalRows.find((r) => this.rowKeyStr(r) === key);
            }

            /** Finds the live Tabulator RowComponent for a given primary
             * key value — used to auto-open a detail deep link once the
             * grid has actually finished building (see the page's initial
             * bootstrap). Not Tabulator's own getRow(id) lookup, which
             * indexes by a field literally named "id" by default — this
             * schema's primary keys are rarely named that, so a direct
             * scan by this table's own configured key column is the
             * reliable option. Single-column parent keys only, same
             * constraint as sub_table embedding generally. */
            findRowComponent(pkValue) {
                const pkField = this.keyFields[0];
                if (!pkField) return null;
                return (
                    this.tabulator
                        .getRows()
                        .find((r) => String(r.getData()[pkField.column_name]) === String(pkValue)) || null
                );
            }

            /**
             * Fetches this table's data fresh from the backend — used for
             * a tab switch (see activateTable). A future child instance
             * embedded in a detail modal skips this entirely and calls
             * renderFromData directly with already-prefetched data — no
             * network call needed there.
             */
            load() {
                this.toolbarEl.style.display = "none";
                this.gridEl.style.display = "none";
                this.spinnerEl.style.display = "";

                // First visit to this table this session: one combined
                // call for schema + rows + every referenced table + every
                // enum (was up to 4 separate GAS invocations — see
                // bootstrapDataTable on the backend). Already cached from
                // an earlier visit: just the lightweight rows-only call,
                // schema/refs/enums untouched.
                const dataPromise = SCHEMA_CACHE[this.tableName]
                    ? apiCall("list_table_rows", { table: this.tableName }).then((res) => ({
                          ok: res.ok,
                          error: res.error,
                          fields: SCHEMA_CACHE[this.tableName],
                          meta: TABLE_META_CACHE[this.tableName],
                          rows: res.rows,
                      }))
                    : apiCall("bootstrap_data_table", { table: this.tableName }).then((res) =>
                          cacheBootstrapResponse(res, this.tableName),
                      );

                dataPromise.then((res) => {
                    // This instance was torn down (e.g. the admin switched
                    // tabs again, or a detail modal closed) before this
                    // came back — discard, nothing to render into anymore.
                    if (this.destroyed) return;
                    this.renderFromData(res);
                });
            }

            /** Renders once data (fields/rows, shaped like
             * bootstrapDataTable's response) is available, regardless of
             * whether load() fetched it or a caller already had it (the
             * page's very first load, or a prefetched child grid). */
            renderFromData(res) {
                if (!res.ok) {
                    this.spinnerEl.style.display = "none";
                    this.gridEl.style.display = "";
                    this.gridEl.textContent = res.error || "Could not load this table.";
                    return;
                }
                this.schema = res.fields;
                this.meta = res.meta || {};
                this.keyFields = this.schema.filter((f) => f.primary_key === true);
                let rows = res.rows;
                if (this.parentScope) {
                    rows = rows.filter(
                        (r) => String(r[this.parentScope.column]) === String(this.parentScope.value),
                    );
                }
                this.originalRows = rows;

                this.buildToolbar();
                this.spinnerEl.style.display = "none";
                this.toolbarEl.style.display = "";
                this.gridEl.style.display = "";
                // Constructed only once the grid container is actually
                // visible — sizing a height-based grid inside a
                // display:none element is a common source of glitches.
                this.renderGrid(this.originalRows);
                if (this.onRendered) this.onRendered(this);
            }

            // --- Toolbar: search + add/edit/save/cancel -------------------

            buildToolbar() {
                this.toolbarEl.innerHTML = "";

                if (this.schema.some((f) => f.searchable === true)) {
                    const search = document.createElement("input");
                    search.type = "search";
                    search.placeholder = "Search…";
                    search.style.marginRight = "auto";
                    search.style.maxWidth = "16rem";
                    search.addEventListener("input", () => {
                        this.searchText = search.value.trim().toLowerCase();
                        this.tabulator.setFilter((row) => this.rowMatchesFilters(row));
                        this.updateSelectAllCheckbox_();
                    });
                    this.toolbarEl.appendChild(search);
                }

                this.addBtn = document.createElement("button");
                this.addBtn.className = "dash-btn";
                this.addBtn.textContent = "+ Add row";
                this.addBtn.addEventListener("click", () => this.openAddModal());
                this.toolbarEl.appendChild(this.addBtn);

                this.editBtn = document.createElement("button");
                this.editBtn.className = "dash-btn";
                this.editBtn.style.background = "var(--line)";
                this.editBtn.style.color = "var(--ink)";
                this.editBtn.textContent = "Edit";
                this.editBtn.addEventListener("click", () => this.toggleEditMode());
                this.toolbarEl.appendChild(this.editBtn);

                this.cancelBtn = document.createElement("button");
                this.cancelBtn.className = "dash-btn";
                this.cancelBtn.textContent = "Cancel";
                this.cancelBtn.style.background = "var(--line)";
                this.cancelBtn.style.color = "var(--ink)";
                this.cancelBtn.addEventListener("click", () => this.cancelEdits());
                this.toolbarEl.appendChild(this.cancelBtn);

                this.saveBtn = document.createElement("button");
                this.saveBtn.className = "dash-btn";
                this.saveBtn.textContent = "Save";
                this.saveBtn.addEventListener("click", () => this.saveDirtyRows());
                this.toolbarEl.appendChild(this.saveBtn);

                this.bulkDeleteBtn = document.createElement("button");
                this.bulkDeleteBtn.className = "dash-btn";
                this.bulkDeleteBtn.style.background = "var(--line)";
                this.bulkDeleteBtn.style.color = "var(--ink)";
                this.bulkDeleteBtn.addEventListener("click", () => this.handleBulkDelete());
                this.toolbarEl.appendChild(this.bulkDeleteBtn);

                this.updateToolbarButtons();
            }

            updateToolbarButtons() {
                // Includes pending enum-option edits (any enum-manage
                // popup, any grid instance) — they ride along on the next
                // Save regardless of which grid it's clicked from, so the
                // count here needs to reflect that too, not just this
                // instance's own dirty state.
                const dirtyCount = Object.keys(this.dirty).length + Object.keys(ENUM_OPTION_DIRTY).length;

                this.editBtn.style.display = this.editMode ? "none" : "";
                this.cancelBtn.style.display = this.editMode ? "" : "none";
                this.saveBtn.style.display = this.editMode ? "" : "none";
                this.saveBtn.disabled = dirtyCount === 0;
                this.saveBtn.textContent = dirtyCount ? "Save (" + dirtyCount + ")" : "Save";
                this.addBtn.style.display = this.editMode ? "" : "none";

                // Only ever meaningful alongside the per-row ❌ column
                // (buildBulkDeleteColumn), which is gated the same way —
                // edit mode + hard_delete — so this mirrors that gate
                // exactly, plus needing at least one row actually checked.
                const selectedCount =
                    this.editMode && this.meta.hard_delete === true && this.tabulator
                        ? this.tabulator.getSelectedRows().length
                        : 0;
                this.bulkDeleteBtn.style.display = selectedCount > 0 ? "" : "none";
                this.bulkDeleteBtn.textContent = "Delete Selected (" + selectedCount + ")";
            }

            /** Keeps the header select-all checkbox's checked/indeterminate
             * state honest against this.tabulator.getRows("active") — the
             * same filtered-rows set its own click handler acts on (see
             * buildBulkDeleteColumn) — after any selection change, whether
             * from the header itself, an individual row checkbox, or a
             * filter change that alters what's currently active. */
            updateSelectAllCheckbox_() {
                if (!this.selectAllCheckboxEl || !this.tabulator) return;
                const activeRows = this.tabulator.getRows("active");
                const selectedActive = activeRows.filter((r) => r.isSelected());
                this.selectAllCheckboxEl.checked = activeRows.length > 0 && selectedActive.length === activeRows.length;
                this.selectAllCheckboxEl.indeterminate = selectedActive.length > 0 && selectedActive.length < activeRows.length;
            }

            // setColumns/replaceData/setFilter are all asynchronous in
            // Tabulator 5.x (they return promises) — firing them
            // back-to-back without chaining let a later call start
            // rebuilding the grid before an earlier one had actually
            // finished. Also gated on tableReady: calling any of them
            // before this instance's own tableBuilt event isn't just
            // racy, it can fail outright (see the constructor's tableReady
            // comment) — that, not the chaining alone, was the actual
            // cause of the first click after a table load sometimes not
            // registering at all.

            /** Shared tail of every "rebuild the grid's columns" action
             * (toggling edit mode, an enum-manage Apply affecting this
             * instance) — setColumns then re-attach the filter/manage
             * icons and refresh the toolbar. */
            rebuildColumns() {
                return this.tableReady
                    .then(() => this.tabulator.setColumns(this.buildColumns()))
                    .then(() => {
                        this.attachColumnFilterIcons();
                        this.attachColumnManageIcons();
