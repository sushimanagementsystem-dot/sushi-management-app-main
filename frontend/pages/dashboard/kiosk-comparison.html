<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Kiosk Comparison</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/dashboard.css" />
</head>
<body>
    <div class="dash-shell">
        <nav class="dash-sidebar" id="dashSidebar"></nav>

        <!-- Hidden until initDashboard() confirms access. -->
        <main class="dash-main" id="dashMain" style="display: none">
            <div class="dash-content">
                <h1>Kiosk Comparison</h1>
                <div class="kpi-filters" id="compareFilters"></div>
                <div class="dash-spinner" id="compareSpinner"></div>
                <div id="compareError" style="display: none; color: #b3261e"></div>

                <div id="compareContent" style="display: none; flex: 1; min-height: 0; overflow-y: auto">
                    <div class="kpi-compare-table-wrap">
                        <table class="kpi-compare-table" id="compareTable"></table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/common.js"></script>
    <script src="/assets/dashboard-common.js"></script>
    <script>
        const COMPARE_PRESETS = [
            { key: "today", label: "Today" },
            { key: "last7", label: "Last 7 days" },
            { key: "last30", label: "Last 30 days" },
            { key: "thisMonth", label: "This month" },
        ];

        let COMPARE_FILTERS = { startDate: "", endDate: "" };

        initDashboard("kiosk-comparison").then((ok) => {
            if (!ok) return;
            buildCompareFilters_();
            applyComparePreset_("last7");
        });

        // --- Date helpers (same convention as dashboard.html) --------------------

        function pad2c_(n) {
            return n < 10 ? "0" + n : String(n);
        }
        function todayStrC_() {
            const d = new Date();
            return d.getFullYear() + "-" + pad2c_(d.getMonth() + 1) + "-" + pad2c_(d.getDate());
        }
        function addDaysStrC_(dateStr, n) {
            const [y, m, d] = dateStr.split("-").map(Number);
            const dt = new Date(y, m - 1, d + n);
            return dt.getFullYear() + "-" + pad2c_(dt.getMonth() + 1) + "-" + pad2c_(dt.getDate());
        }

        // --- Filters ---------------------------------------------------------

        function buildCompareFilters_() {
            const el = document.getElementById("compareFilters");
            el.innerHTML = "";

            COMPARE_PRESETS.forEach((p) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "kpi-preset-btn";
                btn.textContent = p.label;
                btn.dataset.preset = p.key;
                btn.addEventListener("click", () => applyComparePreset_(p.key));
                el.appendChild(btn);
            });

            const startInput = document.createElement("input");
            startInput.type = "date";
            startInput.addEventListener("change", () => {
                COMPARE_FILTERS.startDate = startInput.value;
                clearComparePresetHighlight_();
                loadKioskComparison_();
            });
            const toLabel = document.createTextNode(" to ");
            const endInput = document.createElement("input");
            endInput.type = "date";
            endInput.addEventListener("change", () => {
                COMPARE_FILTERS.endDate = endInput.value;
                clearComparePresetHighlight_();
                loadKioskComparison_();
            });
            el.appendChild(startInput);
            el.appendChild(toLabel);
            el.appendChild(endInput);
            el._startInput = startInput;
            el._endInput = endInput;
        }

        function applyComparePreset_(presetKey) {
            const end = todayStrC_();
            let start;
            if (presetKey === "today") start = end;
            else if (presetKey === "last30") start = addDaysStrC_(end, -29);
            else if (presetKey === "thisMonth") start = end.slice(0, 8) + "01";
            else start = addDaysStrC_(end, -6); // last7, and the default

            COMPARE_FILTERS.startDate = start;
            COMPARE_FILTERS.endDate = end;

            const el = document.getElementById("compareFilters");
            if (el._startInput) el._startInput.value = start;
            if (el._endInput) el._endInput.value = end;
            el.querySelectorAll(".kpi-preset-btn").forEach((b) => {
                b.classList.toggle("kpi-preset-active", b.dataset.preset === presetKey);
            });

            loadKioskComparison_();
        }

        function clearComparePresetHighlight_() {
            document.getElementById("compareFilters")
                .querySelectorAll(".kpi-preset-btn")
                .forEach((b) => b.classList.remove("kpi-preset-active"));
        }

        // --- Load + render -----------------------------------------------------

        function loadKioskComparison_() {
            const spinner = document.getElementById("compareSpinner");
            const content = document.getElementById("compareContent");
            const errorEl = document.getElementById("compareError");
            spinner.style.display = "";
            content.style.display = "none";
            errorEl.style.display = "none";

            return apiCall("bootstrap_kiosk_comparison", {
                startDate: COMPARE_FILTERS.startDate,
                endDate: COMPARE_FILTERS.endDate,
            })
                .then((res) => {
                    spinner.style.display = "none";
                    if (!res.ok) {
                        errorEl.style.display = "";
                        errorEl.textContent = res.error || "Failed to load.";
                        return;
                    }
                    content.style.display = "";
                    renderCompareTable_(res);
                })
                .catch(() => {
                    spinner.style.display = "none";
                    errorEl.style.display = "";
                    errorEl.textContent = "Failed to load.";
                });
        }

        function moneyStrC_(n) {
            return "€" + (Math.round((n || 0) * 100) / 100).toFixed(2);
        }
        function qtyStrC_(n) {
            const r = Math.round((n || 0) * 100) / 100;
            return Number.isInteger(r) ? String(r) : r.toFixed(2);
        }

        // Each row is {label, cells: [{text, rate?, warn?}]} — rate cells get
        // the tinted .kpi-rate-cell treatment so they read as distinct from
        // raw totals at a glance (spec §23's misleading-totals rule), warn
        // cells get the coverage-warning color.
        function renderCompareTable_(res) {
            const table = document.getElementById("compareTable");
            table.innerHTML = "";

            const columns = [
                "Kiosk", "Waste Cost", "Waste Rate %", "Damage Cost", "Damage Rate /100",
                "Staff Food Cost", "Stocktake", "Deliveries", "Unmapped Lines", "Approved Value", "Coverage",
            ];
            const thead = document.createElement("thead");
            const headRow = document.createElement("tr");
            columns.forEach((c) => {
                const th = document.createElement("th");
                th.textContent = c;
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            res.kiosks.forEach((kiosk) => {
                const kioskId = kiosk.id;
                const waste = (res.movementStats[kioskId] || {}).EXPIRED_WASTE || { qty: 0, cost: 0, uncostedCount: 0 };
                const damage = (res.movementStats[kioskId] || {}).DAMAGE || { qty: 0, cost: 0, uncostedCount: 0 };
                const staffFood = ((res.staffFood[kioskId] || {}).total) || { cost: 0 };
                const rates = res.damageWasteRates[kioskId] || { plannedQty: 0, damage: { ratePer100: null }, waste: { ratePct: null } };
                const stocktake = res.stocktakeStatus[kioskId] || { status: "MISSING" };
                const delivery = res.deliveryInvoice[kioskId] || { submitted: 0, unmappedLines: 0, approvedValue: 0 };

                const coverageWarnings = [];
                if (rates.plannedQty === 0) coverageWarnings.push("no production data");
                if (stocktake.status === "MISSING") coverageWarnings.push("no complete stocktake");
                else if (stocktake.status === "STALE") coverageWarnings.push("stale stocktake");

                const tr = document.createElement("tr");
                tr.appendChild(td_(kiosk.name));
                tr.appendChild(td_(moneyStrC_(waste.cost)));
                tr.appendChild(td_(rates.waste.ratePct === null ? "n/a" : rates.waste.ratePct + "%", true));
                tr.appendChild(td_(moneyStrC_(damage.cost)));
                tr.appendChild(td_(rates.damage.ratePer100 === null ? "n/a" : rates.damage.ratePer100, true));
                tr.appendChild(td_(moneyStrC_(staffFood.cost)));

                const stocktakeTd = document.createElement("td");
                const badge = document.createElement("span");
                badge.className = "kpi-badge kpi-badge-" + stocktake.status.toLowerCase();
                badge.textContent = stocktake.status;
                stocktakeTd.appendChild(badge);
                tr.appendChild(stocktakeTd);

                tr.appendChild(td_(String(delivery.submitted)));
                tr.appendChild(td_(String(delivery.unmappedLines)));
                tr.appendChild(td_(moneyStrC_(delivery.approvedValue)));

                const covTd = document.createElement("td");
                if (coverageWarnings.length) {
                    covTd.className = "kpi-coverage-warn";
                    covTd.textContent = coverageWarnings.join("; ");
                } else {
                    covTd.textContent = "—";
                }
                tr.appendChild(covTd);

                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            function td_(text, isRate) {
                const cell = document.createElement("td");
                if (isRate) cell.className = "kpi-rate-cell";
                cell.textContent = text;
                return cell;
            }
        }
    </script>
</body>
</html>
